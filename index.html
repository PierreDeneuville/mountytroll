<script>/* MountyHall Solo v24 */
/* ===== 00_core.js ===== */
'use strict';
/* ==========================================================================
   MountyHall Solo — cœur : namespace, RNG, dés, constantes, données
   Les règles [OFF] viennent de mountyhall.com/MH_Rules ; les chiffres
   [EXTRA] (monstres, objets, prix…) sont des valeurs de jeu inventées.
   ========================================================================== */
const MH = (globalThis.MH = globalThis.MH || {});

/* ---------- RNG déterministe (mulberry32) ---------- */
MH.seed = function (s) {
  let a = (s >>> 0) || 1;
  MH._seed = a;
  MH._getRng = () => a; MH._setRng = v => { a = v | 0; };
  MH._r = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
MH.seed(Date.now());
MH.rnd = () => MH._r();
MH.ri = (a, b) => a + Math.floor(MH.rnd() * (b - a + 1));
MH.pick = arr => arr[Math.floor(MH.rnd() * arr.length)];
/** n dés à `f` faces (somme). */
MH.d = function (n, f) { let s = 0; n = Math.max(0, Math.floor(n)); for (let i = 0; i < n; i++) s += 1 + Math.floor(MH.rnd() * f); return s; };
MH.chance = p => MH.rnd() < p;
MH.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
MH.cheb = (ax, ay, bx, by) => Math.max(Math.abs(ax - bx), Math.abs(ay - by));
MH.shuffle = function (arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(MH.rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
MH.cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- Constantes de règles [OFF] ---------- */
MH.PA_MAX = 6;
MH.TURN_MIN = 720;           // 12 h
MH.LEVELS_MAX = 12;          // N-1 … N-12
MH.MAP_W = 64; MH.MAP_H = 64;

/** Coût PA d'échec d'un talent (coût indiqué → PA dépensés si échec). */
MH.FAIL_COST = { 1: 1, 2: 2, 3: 2, 4: 2, 5: 3, 6: 3 };

/** Caps d'expérience : PI cumulés requis pour atteindre le niveau L. */
MH.piForLevel = L => (L <= 1 ? 0 : 10 * ((L * (L + 1)) / 2 - 1));
MH.levelFromPI = function (pi) { let L = 1; while (pi >= MH.piForLevel(L + 1)) L++; return L; };

/** Expérience gagnée en tuant : 10 + 2×(Δniveau) + niveau cible [OFF] */
MH.killPX = (lvlTroll, lvlTarget) => Math.max(0, 10 + 2 * (lvlTarget - lvlTroll) + lvlTarget);

/* ---------- Races [OFF] ---------- */
MH.RACES = {

    id: 'skrim', name: 'Skrim', att: 4, esq: 3, deg: 3, reg: 1, pv: 30, vue: 3,

  },

    comp: 'acceleration_metabolisme', sort: 'vampirisme',
    blurb: 'Guerrier hargneux, frappe fort et le premier.',
    cost: { att: 16, esq: 16, deg: 12, reg: 30, arm: 30, vue: 16, pv: 16, tps: 18 },
    skin: '#b4673f', dark: '#74391f', eye: '#ffe27a'
  },
  tomawak: {
    id: 'tomawak', name: 'Tomawak', att: 3, esq: 3, deg: 3, reg: 1, pv: 30, vue: 4,
    comp: 'camouflage', sort: 'projectile_magique',
    blurb: 'Discret, voit plus loin, attaque par surprise.',

    skin: '#5f93a3', dark: '#35596a', eye: '#d6ff7a'
  },

    comp: 'balayage', sort: 'siphon_ames',
    blurb: 'Paria maudit, régénère plus vite, aura sinistre.',

    skin: '#7a5f94', dark: '#3d2f52', eye: '#ff6a8a'
  }
};

/* ---------- Calendrier (flavor) [EXTRA] ---------- */
MH.MONTHS = ['Mouche', 'Dindon', 'Goblin', 'Champignon', 'Gowap', 'Gigot', 'Pustule', 'Grattage', 'Bourre-Pif', 'Gloubi', 'Hibernation', 'Ragnarok'];
MH.DAYS = ['Mundidey', 'Tundidey', 'Wensdidey', 'Thorsdidey', 'Fridey', 'Satdidey', 'Sundidey'];
MH.dateStr = function (t) {
  const day = Math.floor(t / 1440);
  const m = Math.floor(day / 30) % 12, j = (day % 30) + 1, cycle = 25 + Math.floor(day / 360);
  const hh = Math.floor((t % 1440) / 60), mm = Math.floor(t % 60);
  return { text: `${MH.DAYS[day % 7]} ${j}° jour du ${MH.MONTHS[m]} · ${cycle}° cycle`, hour: String(hh).padStart(2, '0') + 'h' + String(mm).padStart(2, '0') };
};

  { id: 'chauve',    name: 'Chauve-Souris Géante', lvl: 3, pv: 12, att: 3, esq: 5, deg: 1, reg: 1, arm: 0, vue: 4, rm: 6, dur: 560, moveCost: 1, depth: [1, 4],  beh: 'aggro', group: [1, 3], shape: 'wing',    pal: ['#58506b', '#2c2740', '#ff5a7a'] },
  { id: 'gnoll',     name: 'Gnoll',            lvl: 4,  pv: 22,  att: 4, esq: 3, deg: 2, reg: 1, arm: 0, vue: 3, rm: 9,   dur: 720, depth: [2, 5],  beh: 'aggro', group: [2, 4], shape: 'brute',   pal: ['#b79b5b', '#6e5a2f', '#ff6a3a'] },

'use strict';
/* ==========================================================================
   Monde : tuiles, niveaux (N0 surface, N-1…N-12), génération, index spatial
   ========================================================================== */
MH.T = { ROCK: 0, FLOOR: 1, SHAFT: 2, GRASS: 3, PATH: 4, TREE: 5, WALL: 6, DOOR: 7, MOSS: 8, WATER: 9, FLOORB: 10, BONES: 11 };
MH.walkableTile = t => t !== 0 && t !== 5 && t !== 6 && t !== 9;

MH.G = null; // état global de la partie (voir MH.newGame)

/* ---------- Niveau ---------- */
MH.makeLevel = function (n) {
  const w = MH.MAP_W, h = MH.MAP_H;
  return { n, w, h, t: new Uint8Array(w * h), seen: new Uint8Array(w * h), ents: new Map(), items: new Map(), places: [], main: [] };
};
MH.lv = n => MH.G.levels[n];
MH.idx = (L, x, y) => y * L.w + x;
MH.inb = (L, x, y) => x >= 0 && y >= 0 && x < L.w && y < L.h;
MH.tileAt = (L, x, y) => (MH.inb(L, x, y) ? L.t[y * L.w + x] : 0);
MH.isWalk = (L, x, y) => MH.walkableTile(MH.tileAt(L, x, y));

/* ---------- Index des entités par zone (plusieurs créatures par zone) ---------- */
MH.entsAt = function (n, x, y) {
  const L = MH.G.levels[n]; if (!L) return [];
  return L.ents.get(y * L.w + x) || [];
};
MH.placeEnt = function (c) {
  const L = MH.G.levels[c.n], k = c.y * L.w + c.x;
  let a = L.ents.get(k); if (!a) { a = []; L.ents.set(k, a); }
  if (!a.includes(c)) a.push(c);
};
MH.unplaceEnt = function (c) {
  const L = MH.G.levels[c.n], k = c.y * L.w + c.x;
  const a = L.ents.get(k); if (!a) return;
  const i = a.indexOf(c); if (i >= 0) a.splice(i, 1);
  if (!a.length) L.ents.delete(k);
};
MH.moveEntTo = function (c, x, y, n) {
  MH.unplaceEnt(c); if (x !== c.x) c.face = Math.sign(x - c.x); c.x = x; c.y = y; if (n !== undefined) c.n = n; MH.placeEnt(c);
};
/** Autres créatures présentes (vivantes) sur la zone de c. */
MH.othersHere = c => MH.entsAt(c.n, c.x, c.y).filter(o => o !== c && !o.dead);

/* ---------- Objets au sol ---------- */
MH.itemsAt = function (n, x, y) {
  const L = MH.G.levels[n]; return (L && L.items.get(y * L.w + x)) || [];
};
MH.dropItem = function (n, x, y, it) {
  const L = MH.G.levels[n], k = y * L.w + x;
  let a = L.items.get(k); if (!a) { a = []; L.items.set(k, a); }
  // les piles de GG' fusionnent
  if (it.cat === 'gg') { const g = a.find(o => o.cat === 'gg'); if (g) { g.amount += it.amount; return; } }
  a.push(it);
};
MH.takeItem = function (n, x, y, it) {
  const L = MH.G.levels[n], k = y * L.w + x, a = L.items.get(k); if (!a) return false;
  const i = a.indexOf(it); if (i < 0) return false; a.splice(i, 1); if (!a.length) L.items.delete(k); return true;
};

/* ---------- Génération de cavernes (automate cellulaire) ---------- */
MH._components = function (L, walk) {
  const w = L.w, h = L.h, comp = new Int32Array(w * h).fill(-1), list = [];
  for (let s = 0; s < w * h; s++) {
    if (comp[s] !== -1 || !walk(L.t[s])) continue;
    const id = list.length, cells = [s]; comp[s] = id;
    for (let q = 0; q < cells.length; q++) {
      const c = cells[q], cx = c % w, cy = (c / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny * w + nx; if (comp[ni] === -1 && walk(L.t[ni])) { comp[ni] = id; cells.push(ni); }
      }
    }
    list.push(cells);
  }
  return list;
};
MH._carveLine = function (L, x0, y0, x1, y1) {
  let x = x0, y = y0;
  while (x !== x1) { x += Math.sign(x1 - x); MH._carve(L, x, y); }
  while (y !== y1) { y += Math.sign(y1 - y); MH._carve(L, x, y); }
};
MH._carve = function (L, x, y) {
  if (x < 1 || y < 1 || x >= L.w - 1 || y >= L.h - 1) return;
  const i = y * L.w + x; if (L.t[i] === MH.T.ROCK) L.t[i] = MH.T.FLOOR;
};
MH._carveRect = function (L, x0, y0, x1, y1, tile) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (x < 1 || y < 1 || x >= L.w - 1 || y >= L.h - 1) continue;
    L.t[y * L.w + x] = tile;
  }
};

MH.genDungeonLevel = function (n, above) {
  const L = MH.makeLevel(n), w = L.w, h = L.h, T = MH.T;
  // 1. bruit initial
  let g = new Uint8Array(w * h);
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) g[y * w + x] = MH.rnd() < 0.47 ? 1 : 0;
  // 2. lissage
  for (let it = 0; it < 5; it++) {
    const g2 = new Uint8Array(w * h);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      let walls = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (!g[(y + dy) * w + x + dx]) walls++;
      g2[y * w + x] = walls >= 5 ? 0 : 1;
    }
    g = g2;
  }
  for (let i = 0; i < w * h; i++) L.t[i] = g[i] ? T.FLOOR : T.ROCK;
  // 3. garder la plus grande caverne, relier les autres assez grandes
  let comps = MH._components(L, MH.walkableTile).sort((a, b) => b.length - a.length);
  const main = comps[0] || [];
  for (let k = 1; k < comps.length; k++) {
    const c = comps[k];
    if (c.length < 25) { c.forEach(i => { L.t[i] = T.ROCK; }); continue; }
    const s = c[(c.length / 2) | 0], sx = s % w, sy = (s / w) | 0;
    let best = main[0], bd = 1e9;
    for (let q = 0; q < main.length; q += 3) { const m = main[q], d = Math.abs((m % w) - sx) + Math.abs(((m / w) | 0) - sy); if (d < bd) { bd = d; best = m; } }
    MH._carveLine(L, sx, sy, best % w, (best / w) | 0);
  }
  // 4. puits reliant au niveau supérieur (même X,Y praticables sur les deux niveaux)
  L.shafts = [];
  const connect = (x, y) => {
    let best = main[0], bd = 1e9;
    for (let q = 0; q < main.length; q += 2) { const m = main[q], d = Math.abs((m % w) - x) + Math.abs(((m / w) | 0) - y); if (d < bd) { bd = d; best = m; } }
    MH._carveLine(L, x, y, best % w, (best / w) | 0);
  };
  if (above && above.n === 0) {
    // sous le Gouffre de la surface : grande salle d'entrée
    const s = above.shafts[0];
    MH._carveRect(L, s.x - 3, s.y - 2, s.x + 3, s.y + 3, T.FLOOR);
    above.shafts.forEach(q => { L.t[q.y * w + q.x] = T.SHAFT; L.shafts.push({ x: q.x, y: q.y }); });
    connect(s.x, s.y + 3);
  }
  const cand = (above && above.n > 0) ? above.main.filter(i => above.t[i] === T.FLOOR || above.t[i] === T.MOSS) : [];
  const nShafts = (above && above.n > 0) ? 3 : 0;
  for (let k = 0; k < nShafts && cand.length; k++) {
    const i = cand[Math.floor(MH.rnd() * cand.length)], x = i % w, y = (i / w) | 0;
    if (x < 4 || y < 4 || x > w - 5 || y > h - 5) { k--; cand.splice(cand.indexOf(i), 1); continue; }
    MH._carveRect(L, x - 1, y - 1, x + 1, y + 1, T.FLOOR);
    L.t[y * w + x] = T.SHAFT; above.t[y * w + x] = T.SHAFT;
    L.shafts.push({ x, y });
    connect(x, y); // relier la poche à la caverne principale
  }
  // 5. décor : mousse, ossements
  for (let i = 0; i < w * h; i++) {
    if (L.t[i] !== T.FLOOR) continue;
    const r = MH.rnd(); if (r < 0.06) L.t[i] = T.MOSS; else if (r < 0.075) L.t[i] = T.BONES;
  }
  // 6. cellules praticables de la composante principale (après connexions)
  comps = MH._components(L, MH.walkableTile).sort((a, b) => b.length - a.length);
  L.main = comps[0] || [];
  comps.slice(1).forEach(c => { if (c.length < 25) c.forEach(i => { L.t[i] = T.ROCK; }); });
  return L;
};

/* ---------- Surface (N0) : village des Trõlls ---------- */
MH.genSurface = function () {
  const L = MH.makeLevel(0), w = L.w, h = L.h, T = MH.T;
  for (let i = 0; i < w * h; i++) L.t[i] = T.GRASS;
  // forêt de bordure
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const d = Math.min(x, y, w - 1 - x, h - 1 - y);
    if (d < 2 || (d < 5 && MH.rnd() < 0.55 - d * 0.1)) L.t[y * w + x] = T.TREE;
    else if (MH.rnd() < 0.045) L.t[y * w + x] = T.TREE;
  }
  // mare
  for (let y = 44; y < 52; y++) for (let x = 10; x < 20; x++) {
    const dx = x - 15, dy = y - 48; if (dx * dx / 25 + dy * dy / 14 < 1) L.t[y * w + x] = T.WATER;
  }
  const cx = 32, cy = 32;
  // chemins en croix + place centrale
  MH._carveRect(L, cx - 1, 6, cx + 1, h - 7, T.PATH);
  MH._carveRect(L, 6, cy - 1, w - 7, cy + 1, T.PATH);
  MH._carveRect(L, cx - 4, cy - 3, cx + 4, cy + 3, T.PATH);
  // dégager les abords
  for (let y = 10; y < 54; y++) for (let x = 12; x < 53; x++) if (L.t[y * w + x] === T.TREE && MH.rnd() < 0.9) L.t[y * w + x] = T.GRASS;
  // bâtiments : id, nom, position (coin sup. gauche), taille
  const defs = [
    { id: 'echoppe', name: 'Échoppe de Gnak', x: 21, y: 22, w: 7, h: 5 },
    { id: 'taniere', name: 'Tanière', x: 36, y: 22, w: 7, h: 5 },
    { id: 'auberge', name: 'Auberge du Gowap Boiteux', x: 21, y: 37, w: 7, h: 5 },
    { id: 'forge', name: 'Forge de Brokh', x: 36, y: 37, w: 7, h: 5 },
    { id: 'soin', name: 'Soigneur Mama-Gluc', x: 46, y: 28, w: 6, h: 5 },
    { id: 'dojo', name: "Salle d'Entraînement", x: 12, y: 28, w: 6, h: 5 }
  ];
  defs.forEach(b => {
    for (let y = b.y; y < b.y + b.h; y++) for (let x = b.x; x < b.x + b.w; x++) {
      const edge = (x === b.x || y === b.y || x === b.x + b.w - 1 || y === b.y + b.h - 1);
      L.t[y * w + x] = edge ? T.WALL : T.FLOORB;
    }
    const dx = b.x + (b.w >> 1), dy = b.y + b.h - 1; L.t[dy * w + dx] = T.DOOR;
    // sentier jusqu'au chemin
    for (let yy = dy + 1; yy < dy + 3; yy++) if (MH.inb(L, dx, yy) && L.t[yy * w + dx] !== T.PATH) L.t[yy * w + dx] = T.PATH;
    L.places.push({ id: b.id, name: b.name, x0: b.x + 1, y0: b.y + 1, x1: b.x + b.w - 2, y1: b.y + b.h - 2, doorX: dx, doorY: dy, safe: true });
  });
  // gouffre (accès N-1)
  MH._carveRect(L, cx - 2, 11, cx + 2, 13, T.GRASS);
  for (let x = cx - 1; x <= cx + 1; x++) L.t[12 * w + x] = T.SHAFT;
  L.shafts = [{ x: cx, y: 12 }, { x: cx - 1, y: 12 }, { x: cx + 1, y: 12 }];
  L.places.push({ id: 'gouffre', name: 'Le Gouffre', x0: cx - 2, y0: 11, x1: cx + 2, y1: 13, safe: true });
  // chemin du gouffre
  MH._carveRect(L, cx, 14, cx, cy - 4, T.PATH);
  // fleurs/mousse décoratives : gérées au rendu par hash
  // cellules praticables (composante principale)
  const comps = MH._components(L, MH.walkableTile).sort((a, b) => b.length - a.length);
  L.main = comps[0] || [];
  L.spawn = { x: cx, y: cy + 5 };
  return L;
};

/* ---------- Brouillard : zones vues par le joueur ---------- */
MH.revealAround = function (c) {
  const L = MH.G.levels[c.n], r = MH.vueOf(c);
  for (let y = c.y - r; y <= c.y + r; y++) for (let x = c.x - r; x <= c.x + r; x++) {
    if (MH.inb(L, x, y)) L.seen[y * L.w + x] = 1;
  }
};

/* ---------- Lieux ---------- */
MH.placeAt = function (n, x, y) {
  const L = MH.G.levels[n]; if (!L) return null;
  for (const p of L.places) {
    if (x >= p.x0 && x <= p.x1 && y >= p.y0 && y <= p.y1) return p;
    if (p.doorX === x && p.doorY === y) return p;
  }
  return null;
};

  const bm = { att: 0, esq: 0, deg: 0, reg: 0, arm: 0, vue: 0, pv: 0 };
  (c.mouches || []).forEach(k => { bm[k] = (bm[k] || 0) + 1; });
  if (c.equip) Object.values(c.equip).forEach(it => { if (it && it.mod) for (const k in it.mod) bm[k] = (bm[k] || 0) + it.mod[k]; });
  (c.buffs || []).forEach(b => { bm[b.stat] = (bm[b.stat] || 0) + b.v; });
  c.bm = bm;
  if (c.kind === 'troll') c.lvl = MH.levelFromPI(c.piTotal);
  return c;
};
MH.vueOf = c => Math.max(1, c.vue + (c.bm ? c.bm.vue : 0));
MH.hpMaxOf = c => c.hpMax + (c.bm ? c.bm.pv : 0);
MH.armOf = c => Math.max(0, c.arm + (c.bm ? c.bm.arm : 0));
MH.armEff = c => Math.max(0, MH.armOf(c) - (c.turn.malusArm || 0));
MH.esqDiceEff = c => Math.max(0, c.esq - (c.turn.malusEsq || 0));
MH.weightOf = c => (c.inv || []).reduce((s, it) => s + (it.w || 0), 0) + Object.values(c.equip || {}).reduce((s, it) => s + (it && it.w || 0), 0);
MH.woundPenalty = c => Math.round(180 * (1 - Math.max(0, c.hp) / Math.max(1, MH.hpMaxOf(c))));
MH.duration = function (c) {
  if (c.kind === 'monster') return c.dur;
  const pen = Math.max(0, MH.woundPenalty(c) + MH.weightOf(c) - c.tpsReserve);
  return Math.max(360, MH.TURN_MIN - c.tpsBonus + pen);
};
MH.woundText = function (c) {
  const f = c.hp / MH.hpMaxOf(c);
  return f >= 1 ? 'indemne' : f > 0.75 ? 'légèrement blessé' : f > 0.5 ? 'blessé' : f > 0.25 ? 'gravement blessé' : 'agonisant';
};
MH.isTargetable = c => !c.dead && c.n !== 0 && !(c.state.intang > 0);
MH.hostile = function (a, b) {
  if (a === b) return false;
  if (a.kind === 'monster' && b.kind === 'monster') return false;
  if (a.kind === 'monster' || b.kind === 'monster') return true;
  return MH.trollHostile ? MH.trollHostile(a, b) : false;
};
/** a voit-il o ? (même niveau, dans la vue, camouflage/invisibilité) */
MH.canSee = function (a, o) {
  if (a === o) return true;
  if (a.n !== o.n) return false;
  if (MH.cheb(a.x, a.y, o.x, o.y) > MH.vueOf(a)) return false;
  if (o.state.invis && !(a.seeHidden)) return false;
  if (o.state.camo && !(a.x === o.x && a.y === o.y)) return false;
  return true;
};

/* ---------- Journal & effets visuels ---------- */
MH.msg = function (cls, txt) {
  const G = MH.G; if (!G) return;
  G.log.push({ cls, txt, time: G.time, turn: G.turnNo });
  if (G.log.length > 600) G.log.splice(0, G.log.length - 600);
  if (MH.onLog) MH.onLog(G.log[G.log.length - 1]);
};
MH.fx = function (c, text, color, big) {
  const G = MH.G; if (!G || !G.p || c.n !== G.p.n) return;
  G.fx.push({ x: c.x, y: c.y, text, color: color || '#fff', age: 0, big: !!big });
};

/* ---------- Partie ---------- */
MH.newGame = function (opts) {
  MH.seed(opts.seed || Date.now());
  const G = MH.G = { time: 0, turnNo: 1, levels: {}, actors: [], log: [], fx: [], p: null, stats: { kills: 0, maxLevel: 0 }, flash: null, deathCount: 0 };
  G.levels[0] = MH.genSurface();
  for (let n = 1; n <= MH.LEVELS_MAX; n++) G.levels[n] = MH.genDungeonLevel(n, G.levels[n - 1]);
  for (let n = 1; n <= MH.LEVELS_MAX; n++) MH.populate(G.levels[n]);
  G.knownPotion = {}; G.knownScroll = {};
  if (MH.initTreasure) MH.initTreasure(G);
  if (MH.initSites) MH.initSites(G);
  const p = MH.newTroll(opts.name || 'Hébus', opts.race || 'skrim');
  p.isPlayer = true; G.p = p;
  const sp = G.levels[0].spawn; p.x = sp.x; p.y = sp.y; p.n = 0;
  MH.placeEnt(p);
  MH.recalc(p);
  if (MH.initTalents) MH.initTalents(p, opts.talents);
  if (MH.initSociety) MH.initSociety();
  MH.startTurn(p, true);
  MH.revealAround(p);
  MH.msg('sys', `Bienvenue dans le Monde Souterrain, ${p.name} le ${MH.RACES[p.race].name} !`);
  MH.msg('sys', 'Le Gouffre est au nord du village. En surface, personne ne peut t\'attaquer.');
  return G;
};

/* ---------- Tour / DLA ---------- */
MH.startTurn = function (c, first) {
  const G = MH.G;
  c.turn = { malusEsq: 0, malusArm: 0, conc: 0, used: {} };
  c.pa = MH.PA_MAX - (c.state.down ? 1 : 0);
  // buffs : -1 tour
  if (c.buffs.length) { c.buffs.forEach(b => { b.turns--; }); c.buffs = c.buffs.filter(b => b.turns > 0); }
  if (c.state.glue > 0) c.state.glue--;
  MH.recalc(c);
  let regen = 0;
  if (!first && !c.dead && c.hp < MH.hpMaxOf(c) && !(c.noRegen > 0)) {
    regen = MH.d(c.reg, 3) + (c.bm.reg || 0);
    if (c.kind === 'monster' && c.reg === 0) regen = 0;
    c.hp = Math.min(MH.hpMaxOf(c), c.hp + Math.max(0, regen));
  }
  if (c.noRegen > 0) c.noRegen--;
  c.dur = c.kind === 'monster' ? c.dur : MH.duration(c);
  c.dla = (c.dla || G.time) + (c.kind === 'monster' ? c.dur : MH.duration(c));
  if (c.isPlayer) {
    G.p.timeStart = G.time;
    if (!first) {
      MH.msg('sys', `— Tour n°${G.turnNo} — ${regen > 0 ? 'Régénération : +' + regen + ' PV.' : 'Pas de régénération.'}`);
    }
  }
  return regen;
};

MH.endTurn = function () {
  const G = MH.G, p = G.p;
  const tNext = p.dla;
  MH.msg('sys', `Fin du tour. Les heures passent… (${MH.dateStr(tNext).hour})`);
  MH.advanceTo(tNext);
  G.turnNo++;
  MH.startTurn(p, false);
  MH.worldTick();
  MH.revealAround(p);
};

/** Fait avancer l'horloge ; chaque acteur dont la DLA est passée joue son tour. */
MH.advanceTo = function (t) {
  const G = MH.G, p = G.p;
  let guard = 0;
  while (guard++ < 20000) {
    let a = null;
    for (const o of G.actors) { if (!o.dead && o.dla <= t && (!a || o.dla < a.dla)) a = o; }
    if (!a) break;
    G.time = Math.max(G.time, a.dla);
    const near = Math.abs(a.n - p.n) <= 1;
    MH.startTurn(a, false);
    if (!a.dead) { if (a.kind === 'monster') { if (near) MH.monsterTurn(a); } else if (!a.isPlayer && MH.trollAI) MH.trollAI(a); }
    // startTurn a avancé la DLA d'une durée
  }
  G.time = Math.max(G.time, t);
};

/** Attendre sans dépenser de PA : le temps s'écoule dans la limite de la DLA. */
MH.waitMinutes = function (m) {
  const G = MH.G, p = G.p;
  const t = Math.min(G.time + m, p.dla - 1);
  if (t <= G.time) return { ok: false, msg: 'Ta DLA est trop proche pour attendre encore.' };
  MH.advanceTo(t);
  MH.revealAround(p);
  return { ok: true };
};

MH.spendPA = function (c, n) {
  c.pa -= n;
  if (c.turn && c.turn.conc > 0 && !c._conc) c.turn.conc = Math.max(0, c.turn.conc - n); // −1 %/PA intercalé [OFF]
  if (c.state.intang > 0) { c.state.intang = Math.max(0, c.state.intang - n); if (c.state.intang === 0 && c.isPlayer) MH.msg('sys', 'Tu n\'es plus intangible.'); }
};

/* ---------- Déplacement [OFF] ---------- */
MH.moveCost = function (c, dn) {
  let cost = c.n === 0 ? 1 : (c.kind === 'monster' ? c.moveCost : 2);
  if (MH.othersHere(c).length) cost += 1;
  if (dn) cost += 1;
  if (c.state.glue > 0) cost = Math.min(6, cost * 2);
  return cost;
};
MH.canMoveTo = function (c, dx, dy, dn) {
  const nn = c.n + dn, nx = c.x + dx, ny = c.y + dy;
  // profondeur interne : 0 = surface, 1…12 = N-1…N-12 ; dn = +1 descendre, -1 monter
  if (nn < 0 || nn > MH.LEVELS_MAX) return { ok: false, msg: dn < 0 ? 'Tu es déjà en surface.' : 'Plus bas, c\'est le cœur du monde…' };
  const L = MH.G.levels[nn];
  if (!L || !MH.isWalk(L, nx, ny)) return { ok: false, msg: dn ? 'Il n\'y a que de la roche là-dessous (ou là-dessus).' : 'La roche te barre la route.' };
  return { ok: true, nx, ny, nn };
};
MH.actMove = function (c, dx, dy, dn) {
  dn = dn || 0;
  const chk = MH.canMoveTo(c, dx, dy, dn);
  if (!chk.ok) return chk;
  if (c.state.down) return { ok: false, msg: 'Tu es à terre : relève-toi d\'abord.' };
  const cost = MH.moveCost(c, dn);
  if (cost > c.pa) return { ok: false, msg: `Se déplacer coûte ${cost} PA (il t'en reste ${c.pa}).` };
  MH.spendPA(c, cost);
  const wasCamo = c.state.camo;
  MH.moveEntTo(c, chk.nx, chk.ny, chk.nn);
  if (c.isPlayer) {
    if (c.state.camo) { c.state.camo = false; if (wasCamo) MH.msg('sys', 'Tu perds ton camouflage en bougeant.'); }
    c.state.invis = false;
    MH.revealAround(c);
    MH.onArrive(c);
  }
  return { ok: true, cost };
};
MH.onArrive = function (c) {
  const items = MH.itemsAt(c.n, c.x, c.y);
  const here = MH.othersHere(c).filter(o => MH.canSee(c, o));
  if (c.n === 0 && c._lastN !== 0) MH.msg('sys', 'Tu émerges à la surface : ici, nul ne peut te blesser.');
  c._lastN = c.n;
  const pl = MH.placeAt(c.n, c.x, c.y);
  if (pl && pl !== c._lastPlace) MH.msg('sys', `Lieu : ${pl.name}.`);
  c._lastPlace = pl || null;
  if (here.length) MH.msg('sys', `Sur ta zone : ${here.map(o => o.name).join(', ')}.`);
  if (items.length) MH.msg('loot', `Au sol : ${items.map(i => MH.itemLabel(i, c)).join(', ')}.`);
};
MH.itemLabel = function (it, viewer) {
  if (it.cat === 'gg') return `${it.amount} GG'`;
  return MH.itemName ? MH.itemName(it, viewer) : it.name;
};

/* ---------- Combat [OFF] ---------- */
MH.resolveAttack = function (att, def, o) {
  o = o || {};
  const jaDice = att.att + (o.attDiceBonus || 0);
  const ja = MH.d(jaDice, 6) + (att.bm.att || 0) + (o.attBM || 0);
  const je = MH.d(MH.esqDiceEff(def), 6) + (def.bm.esq || 0);
  const hit = ja > je;
  const dodgeCrit = !hit && je > 2 * ja;
  const r = { ja, je, hit, crit: false, dodgeCrit, jd: 0, armor: 0, dmg: 0, killed: false };
  if (!dodgeCrit) def.turn.malusEsq = (def.turn.malusEsq || 0) + 1; // −1D esquive cumulatif
  if (hit && o.noDamage) return r;
  if (hit) {
    r.crit = ja > 2 * je;
    const dice = Math.floor(att.deg * (r.crit ? 1.5 : 1)) + (o.degDiceBonus || 0);
    r.jd = MH.d(dice, 3) + (att.bm.deg || 0) + (o.degBM || 0);
    r.armor = o.ignoreArmor ? 0 : MH.armEff(def);
    r.dmg = Math.max(1, r.jd - r.armor);
    def.hp -= r.dmg;
    def.turn.malusArm = (def.turn.malusArm || 0) + 1;
    def.lastHitBy = att;
    if (def.kind === 'monster') def.angry = 6;
  }
  return r;
};

MH.canAttack = function (a, d, cost) {
  if (a.dead || d.dead) return { ok: false, msg: 'Cible invalide.' };
  if (a.state.down) return { ok: false, msg: 'Tu es à terre.' };
  if (a.n === 0 || d.n === 0) return { ok: false, msg: 'En surface, le combat est interdit.' };
  if (a.state.intang > 0) return { ok: false, msg: 'Tu es intangible : impossible d\'agir agressivement.' };
  if (d.state.intang > 0) return { ok: false, msg: 'Cette cible est intangible.' };
  if (a.n !== d.n || a.x !== d.x || a.y !== d.y) return { ok: false, msg: 'On ne combat que sur la même zone.' };
  if (cost > a.pa) return { ok: false, msg: `Attaquer coûte ${cost} PA (il t'en reste ${a.pa}).` };
  return { ok: true };
};

MH.actAttack = function (a, d, o) {
  o = o || {};
  const cost = o.cost !== undefined ? o.cost : (a.kind === 'monster' ? a.atkCost : 4);
  const chk = MH.canAttack(a, d, cost);
  if (!chk.ok) return chk;
  MH.spendPA(a, cost);
  a.state.invis = false; a.state.camo = false;
  if (a.turn) a.turn.conc = 0; // un combat annule la concentration [OFF]
  const r = MH.resolveAttack(a, d, o);
  MH.reportAttack(a, d, r, o);
  if (a.kind === 'troll' && r.hit) { a.pxPub += 1; }
  if (d.hp <= 0) { r.killed = true; MH.kill(d, a); }
  return { ok: true, res: r };
};

MH.reportAttack = function (a, d, r, o) {
  const G = MH.G, p = G.p;
  const involved = a === p || d === p;
  const seen = involved || (p.n === a.n && MH.cheb(p.x, p.y, a.x, a.y) <= MH.vueOf(p));
  if (!seen) return;
  const an = a === p ? 'Tu' : a.name, dn = d === p ? 'toi' : d.name;
  const verb = o && o.verb ? o.verb : 'attaques';
  const who = a === p ? `Tu ${verb} ${dn}` : `${a.name} ${o && o.verb ? o.verb + ' sur' : 'attaque'} ${dn}`;
  const rolls = `JA ${r.ja} / JE ${r.je}`;
  if (!r.hit) {
    MH.msg(a === p ? 'miss' : 'dodge', `${who} — ${rolls} : ${r.dodgeCrit ? 'esquive critique !' : 'esquivé.'}`);
    MH.fx(d, r.dodgeCrit ? 'ESQ!' : 'esquive', '#9fb3c8');
  } else {
    const pv = Math.max(0, d.hp);
    MH.msg(d === p ? 'hurt' : 'hit', `${who} — ${rolls} : ${r.crit ? 'COUP CRITIQUE ! ' : 'touché ! '}${r.dmg} dégât${r.dmg > 1 ? 's' : ''}${r.armor ? ' (armure ' + r.armor + ')' : ''} → ${d === p ? 'il te reste' : d.name + ' :'} ${pv}/${MH.hpMaxOf(d)} PV.`);
    MH.fx(d, '-' + r.dmg, r.crit ? '#ffd24a' : (d === p ? '#ff5a5a' : '#ffffff'), r.crit);
    if (MH.onHit) MH.onHit(a, d, r);
  }
};

/* ---------- Mort, butin, expérience ---------- */
MH.kill = function (v, killer) {
  const G = MH.G;
  if (v.dead) return;
  if (v.isPlayer) return MH.playerDeath(killer);
  if (v.kind === 'troll') return MH.trollDeath ? MH.trollDeath(v, killer) : null;
  v.dead = true; MH.unplaceEnt(v);
  const i = G.actors.indexOf(v); if (i >= 0) G.actors.splice(i, 1);
  MH.fx(v, '☠', '#ffd24a', true);
  if (killer && killer.kind === 'troll') {
    const px = MH.killPX(killer.lvl, v.lvl);
    killer.pxPub += px; killer.kills++;
    if (killer.isPlayer) { G.stats.kills++; MH.msg('xp', `${v.name} rend l'âme ! Tu gagnes ${px} PX (redistribuables).`); }
    else if (MH.onTrollKill) MH.onTrollKill(killer, v, px);
  }
  MH.lootMonster(v);
  if (MH.onMonsterDeath) MH.onMonsterDeath(v, killer);
};

MH.lootMonster = function (m) {
  const lvl = m.lvl;
  if (MH.chance(0.78)) {
    const amt = MH.ri(Math.max(1, lvl), lvl * 3 + 3);
    MH.dropItem(m.n, m.x, m.y, { id: MH.uid(), cat: 'gg', amount: amt, w: 0 });
  }
  if (MH.genLoot) MH.genLoot(m);
};

MH.playerDeath = function (killer) {
  const G = MH.G, p = G.p;
  p.deaths++; G.deathCount++;
  const lostPX = p.pxPub + p.pxPer; p.pxPub = 0; p.pxPer = 0;
  const lostGG = Math.floor(p.gg * MH.ri(30, 50) / 100);
  p.gg -= lostGG;
  if (lostGG > 0) MH.dropItem(p.n, p.x, p.y, { id: MH.uid(), cat: 'gg', amount: lostGG, w: 0 });
  if (MH.deathLosses) MH.deathLosses(p);
  const by = killer ? killer.name : 'le destin';
  MH.msg('death', `☠ ${by} t'envoie ad patres ! Tu perds ${lostPX} PX et ${lostGG} GG'.`);
  if (killer && killer.kind === 'troll' && !killer.isPlayer) { const kpx = MH.killPX(killer.lvl, p.lvl); killer.pxPub += kpx; killer.kills++; if (MH.onTrollKill) MH.onTrollKill(killer, p, kpx); }
  MH.unplaceEnt(p);
  p.hp = Math.max(1, Math.ceil(MH.hpMaxOf(p) * 0.3));
  p.state = { down: false, camo: false, invis: false, glue: 0, intang: 0 };
  p.buffs = []; p.turn.malusEsq = 0; p.turn.malusArm = 0; p.turn.conc = 0;
  const sp = G.levels[0].spawn; p.x = sp.x; p.y = sp.y; p.n = 0;
  MH.placeEnt(p); MH.recalc(p); MH.revealAround(p);
  MH.msg('sys', `Résurrection à la surface avec ${p.hp} PV (30 % du maximum).`);
  G.flash = { type: 'death', by, lostPX, lostGG };
};

/* ---------- Expérience & améliorations [OFF] ---------- */
MH.trainAmount = c => (c.lvl <= 2 ? 5 : 2 * c.lvl);
MH.actTrain = function (c) {
  const cost = 2;
  if (cost > c.pa) return { ok: false, msg: `S'entraîner coûte ${cost} PA.` };
  if (c.n !== 0 && c.n !== undefined && false) return { ok: false };
  const total = c.pxPub + c.pxPer;
  if (total <= 0) return { ok: false, msg: 'Tu n\'as aucun PX à convertir en PI.' };
  const y = Math.min(MH.trainAmount(c), total);
  let left = y;
  const a = Math.min(left, c.pxPub); c.pxPub -= a; left -= a;
  c.pxPer -= left;
  MH.spendPA(c, cost);
  c.pi += y; c.piTotal += y;
  if (c.isPlayer) MH.msg('xp', `Entraînement : ${y} PX → ${y} PI (PI : ${c.pi}).`);
  MH.checkLevelUp(c);
  return { ok: true, y };
};
MH.checkLevelUp = function (c) {
  const L = MH.levelFromPI(c.piTotal);
  while (c.lvl < L) {
    c.lvl++;
    const k = MH.pick(['att', 'esq', 'deg', 'reg']);
    c.mouches.push(k);
    MH.recalc(c);
    if (MH.onLevelUp && !c.isPlayer) MH.onLevelUp(c);
    if (c.isPlayer) MH.msg('lvl', `★ NIVEAU ${c.lvl} ! Une mouche se pose sur toi : +1 en ${MH.STAT_LABEL[k]} (bonus permanent).`);
    if (c.isPlayer) { MH.G.stats.maxLevel = Math.max(MH.G.stats.maxLevel, c.lvl); MH.G.flash = { type: 'level', lvl: c.lvl, mouche: k }; }
  }
  c.lvl = MH.levelFromPI(c.piTotal);
};
MH.improveCost = (c, key) => MH.RACES[c.race].cost[key] * ((c.up[key] || 0) + 1);
MH.improveAvailable = function (c, key) {
  if (key === 'arm' && (c.goinfre || 0) < 3) return { ok: false, msg: 'Pour l\'armure naturelle, il faut d\'abord goinfrer 3 objets.' };
  return { ok: true };
};
MH.actImprove = function (c, key) {
  const cost = 5;
  if (cost > c.pa) return { ok: false, msg: `S'améliorer coûte ${cost} PA.` };
  const pi = MH.improveCost(c, key);
  if (c.pi < pi) return { ok: false, msg: `Il faut ${pi} PI (tu en as ${c.pi}).` };
  const av = MH.improveAvailable(c, key); if (!av.ok) return av;
  MH.spendPA(c, cost); c.pi -= pi;
  const nb = c.up[key] || 0; c.up[key] = nb + 1;
  switch (key) {
    case 'att': case 'esq': case 'deg': case 'reg': case 'vue': c[key] += 1; break;
    case 'arm': c.arm += 1; c.goinfre -= 3; break;
    case 'pv': c.hpMax += 10; c.hp += 10; break;
    case 'tps': { const gain = Math.max(0, 30 - 3 * nb); c.tpsBonus += gain; c.tpsReserve += 30 - gain; break; }
  }
  MH.recalc(c);
  if (c.isPlayer) MH.msg('lvl', `Amélioration : ${MH.STAT_LABEL[key]} (−${pi} PI).`);
  return { ok: true };
};

/* ---------- Actions du joueur : ramasser ---------- */
MH.actPickup = function (c, it) {
  if (c.pa < 1) return { ok: false, msg: 'Ramasser coûte 1 PA.' };
  if (!MH.itemsAt(c.n, c.x, c.y).includes(it)) return { ok: false, msg: 'Cet objet n\'est plus là.' };
  MH.spendPA(c, 1);
  MH.takeItem(c.n, c.x, c.y, it);
  if (it.cat === 'gg') { c.gg += it.amount; MH.msg('loot', `Tu ramasses ${it.amount} GG' (total : ${c.gg}).`); }
  else { c.inv.push(it); MH.msg('loot', `Tu ramasses : ${MH.itemLabel(it, c)}.`); }
  return { ok: true };
};

/* ---------- Visibilité pour l'interface ---------- */
MH.visibleEnts = function () {
  const G = MH.G, p = G.p, out = [];
  const r = MH.vueOf(p);
  for (let y = p.y - r; y <= p.y + r; y++) for (let x = p.x - r; x <= p.x + r; x++) {
    if (!MH.inb(G.levels[p.n], x, y)) continue;
    MH.entsAt(p.n, x, y).forEach(o => { if (o !== p && !o.dead && MH.canSee(p, o)) out.push(o); });
  }
  return out;
};
MH.visibleItems = function () {
  const G = MH.G, p = G.p, L = G.levels[p.n], r = MH.vueOf(p), out = [];
  for (let y = p.y - r; y <= p.y + r; y++) for (let x = p.x - r; x <= p.x + r; x++) {
    if (!MH.inb(L, x, y)) continue;
    MH.itemsAt(p.n, x, y).forEach(it => out.push({ it, x, y }));
  }
  return out;
};

/* ===== 25_talents.js ===== */
'use strict';
/* ==========================================================================
   Talents : compétences et sortilèges (jets D100, progression, RM/MM)
   Règles [OFF] : réussite si D100 ≤ %, coût d'échec réduit, progression,
   plafonds 90 % (compétences) / 80 % (sorts), SR et gains de RM/MM.
   Les effets précis de chaque talent sont [EXTRA] (inspirés du bestiaire joueur).
   ========================================================================== */
MH.TALENTS = {};
MH.TCAP = { comp: 90, sort: 80 };
MH._t = function (d) { MH.TALENTS[d.id] = d; };

/* ---------- Utilitaires ---------- */
MH.addBuff = function (c, stat, v, turns, label) {
  c.buffs = c.buffs || [];
  // un même buff de même nature se rafraîchit au lieu de s'empiler
  const b = c.buffs.find(x => x.label === label);
  if (b) { b.v = Math.max(b.v, v); b.turns = Math.max(b.turns, turns); } else c.buffs.push({ stat, v, turns, label });
  MH.recalc(c);
};

/** Seuil de Résistance [OFF] : borné 10..90. */
MH.srOf = function (mm, rm) {
  mm = Math.max(1, mm); rm = Math.max(1, rm);
  const sr = rm >= mm ? 100 - (mm / rm) * 50 : (rm / mm) * 50;
  return MH.clamp(Math.round(sr), 10, 90);
};
/** Jet de résistance + gains de RM (cible) ou de MM (lanceur) [OFF]. */
MH.magicResist = function (caster, target) {
  const sr = MH.srOf(caster.mm, target.rm);
  const resisted = MH.ri(1, 100) <= sr;
  const D2 = n => MH.d(n, 2) - 1;
  if (resisted) {
    let g;
    if (sr < 20) { target.rm += D2(5); target.mm += 1; }
    else if (sr <= 40) { target.rm += D2(4); target.mm += 1; }
    else if (sr <= 60) { g = D2(3); target.rm += g; if (g >= 3) target.mm += 1; }
    else if (sr <= 80) { g = D2(2); target.rm += g; if (g >= 2) target.mm += 1; }
    else target.rm += D2(1);
  } else {
    let g;
    if (sr < 20) caster.mm += D2(1);
    else if (sr <= 40) { g = D2(2); caster.mm += g; if (g >= 3) caster.rm += 1; }
    else if (sr <= 60) { g = D2(3); caster.mm += g; if (g >= 4) caster.rm += 1; }
    else if (sr <= 80) { g = D2(4); caster.mm += g; caster.rm += 1; }
    else { g = D2(5); caster.mm += g; caster.rm += 1; }
  }
  return { sr, resisted };
};

/** Progression d'un talent après un jet [OFF]. */
MH.talentProgress = function (c, T, success) {
  const pct = c.talents[T.id], cap = MH.TCAP[T.type], thr = T.type === 'comp' ? 75 : 75;
  const rollUp = MH.ri(1, 100); let gain = 0;
  if (success) {
    if (rollUp > pct) gain = pct < 50 ? MH.d(1, 6) : pct < thr ? MH.d(1, 3) : 1;
    else gain = 1;
  } else if (pct < 50 && rollUp > pct) gain = 1;
  if (gain) { c.talents[T.id] = Math.min(cap, pct + gain); }
  return gain;
};

/* ---------- Initialisation des talents d'un Trõll ---------- */
MH.baseTalents = function (race) {
  const R = MH.RACES[race];
  return [R.comp, 'connaissance_monstres', R.sort, 'identification_tresors'];
};
MH.defaultAlloc = function (race) {
  const R = MH.RACES[race], a = {};
  a[R.comp] = 15; a[R.sort] = 15; a.connaissance_monstres = 10; a.identification_tresors = 10;
  return a;
};
/** alloc : { talentId: points bonus }, total ≤ 50, chaque talent ≤ 50 % au final. */
MH.initTalents = function (c, alloc) {
  alloc = alloc || MH.defaultAlloc(c.race);
  c.talents = {};
  MH.baseTalents(c.race).forEach(id => { c.talents[id] = 15; });
  let budget = 50;
  Object.keys(alloc).forEach(id => {
    if (c.talents[id] === undefined) return;
    const add = Math.max(0, Math.min(budget, alloc[id] | 0, 50 - c.talents[id]));
    c.talents[id] += add; budget -= add;
  });
};
MH.talentList = function (c) {
  return Object.keys(c.talents || {}).map(id => MH.TALENTS[id]).filter(Boolean)
    .sort((a, b) => (a.type === b.type ? 0 : a.type === 'comp' ? -1 : 1) || (b.reserved ? 1 : 0) - (a.reserved ? 1 : 0) || a.cost - b.cost);
};

/* ---------- Concentration [OFF] : +5 %/PA, −1 %/PA d'action intercalée ---------- */
MH.actConcentrate = function (c, n) {
  n = n | 0;
  if (n < 1 || n > 6) return { ok: false, msg: 'Se concentrer : 1 à 6 PA.' };
  if (n > c.pa) return { ok: false, msg: `Il te reste ${c.pa} PA.` };
  c._conc = true; MH.spendPA(c, n); c._conc = false;
  c.turn.conc = (c.turn.conc || 0) + 5 * n;
  MH.msg('sys', `Tu te concentres : +${c.turn.conc} % sur ton prochain talent.`);
  return { ok: true };
};
MH.actStandUp = function (c) {
  if (!c.state.down) return { ok: false, msg: 'Tu n\'es pas à terre.' };
  if (c.pa < 2) return { ok: false, msg: 'Se relever coûte 2 PA.' };
  MH.spendPA(c, 2); c.state.down = false; MH.msg('sys', 'Tu te relèves.');
  return { ok: true };
};

/* ---------- Dégâts magiques ---------- */
MH.hurtMagic = function (c, d, raw, opts) {
  opts = opts || {};
  let res = { sr: 0, resisted: false };
  if (!opts.noResist) res = MH.magicResist(c, d);
  let dmg = res.resisted ? Math.floor(raw / 2) : raw;
  dmg = Math.max(1, dmg);
  d.hp -= dmg; d.lastHitBy = c;
  if (d.kind === 'monster') { d.angry = 6; if (MH.onHit) MH.onHit(c, d, { magic: true }); }
  MH.fx(d, '-' + dmg, res.resisted ? '#a0a0ff' : '#c58aff');
  return { dmg, res };
};
MH.afterSpell = function (c, d) { if (d.hp <= 0) MH.kill(d, c); };
MH.rollLine = (c, d, T, extra) => `${c.isPlayer ? 'Tu lances' : c.name + ' lance'} ${T.name} sur ${d === (MH.G && MH.G.p) ? 'toi' : d.name}`;

/* ---------- Utilisation d'un talent ---------- */
MH.useTalent = function (c, id, tgt) {
  const T = MH.TALENTS[id];
  if (!T) return { ok: false, msg: 'Talent inconnu.' };
  if (c.talents[id] === undefined) return { ok: false, msg: 'Tu ne connais pas ce talent.' };
  if (c.pa < T.cost) return { ok: false, msg: `${T.name} coûte ${T.cost} PA (il t'en reste ${c.pa}).` };
  if (T.target === 'zone' || T.target === 'view') {
    if (!tgt || tgt.dead) return { ok: false, msg: 'Choisis une cible.' };
    if (c.n === 0 || tgt.n === 0) return { ok: false, msg: 'En surface, pas d\'action agressive.' };
    if (c.state.intang > 0) return { ok: false, msg: 'Tu es intangible.' };
    if (tgt.state.intang > 0) return { ok: false, msg: 'Cible intangible.' };
    if (T.target === 'zone' && (tgt.n !== c.n || tgt.x !== c.x || tgt.y !== c.y)) return { ok: false, msg: 'La cible doit être sur ta zone.' };
    if (T.target === 'view' && !MH.canSee(c, tgt)) return { ok: false, msg: 'Cible hors de vue.' };
    if (T.needsUp && c.state.down) return { ok: false, msg: 'Tu es à terre.' };
  }
  if (T.noSurface && c.n === 0) return { ok: false, msg: `${T.name} : inutilisable en surface.` };
  const bonus = c.turn.conc || 0;
  const pct = Math.min(MH.TCAP[T.type] + 10, c.talents[id] + bonus);
  const roll = MH.ri(1, 100), success = roll <= pct;
  const spent = success ? T.cost : MH.FAIL_COST[T.cost];
  MH.spendPA(c, spent);
  c.turn.conc = 0;
  const gain = MH.talentProgress(c, T, success);
  const verb = T.type === 'comp' ? 'utilises' : 'lances';
  if (!success) {
    MH.msg('sys', `${T.name} (${c.talents[id] - gain} %) : jet ${roll} — raté ! ${spent} PA perdus.${gain ? ' (+' + gain + ' %)' : ''}`);
    if (T.aggr) { c.state.invis = false; c.state.camo = false; }
    return { ok: true, success: false };
  }
  if (c.turn.used[id] === undefined) { c.turn.used[id] = 1; if (c.kind === 'troll') c.pxPer += 1; }
  if (T.aggr) { c.state.invis = false; c.state.camo = false; if (c.turn) c.turn.conc = 0; }
  MH.msg('sys', `${T.name} (${c.talents[id] - gain} %) : jet ${roll} — réussi !${gain ? ' (+' + gain + ' %)' : ''}`);
  const r = T.run(c, tgt) || {};
  return Object.assign({ ok: true, success: true }, r);
};

/* ---------- Frappe générique pour les compétences d'attaque ---------- */
MH.strike = function (a, d, o) {
  const r = MH.resolveAttack(a, d, o);
  MH.reportAttack(a, d, r, o);
  if (a.kind === 'troll' && r.hit) a.pxPub += 1;
  if (d.hp <= 0) { r.killed = true; MH.kill(d, a); }
  return r;
};

MH.spawnMonster = function (spec, n, x, y, gid, first) {
  const m = MH.newMonster(spec, n, x, y, gid);

/** Cases libres autour de (x,y) pour poser un groupe. */
MH._freeAround = function (L, x, y, r) {
  const out = [];
  for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) if (MH.isWalk(L, xx, yy) && L.t[yy * L.w + xx] !== MH.T.SHAFT) out.push([xx, yy]);
  return out;
};

MH.spawnColony = function (L, first, forced) {
  const specs = forced ? [forced] : MH.eligibleSpecs(L.n); if (!specs.length) return 0;
  // pondération : les espèces dont la fourchette est centrée sur le niveau sont plus fréquentes
  const wts = specs.map(s => { const mid = (s.depth[0] + s.depth[1]) / 2; return 1 + 3 / (1 + Math.abs(mid - L.n)) + (s.group[1] > 1 ? 0.8 : 0); });
  let tot = wts.reduce((a, b) => a + b, 0), r = MH.rnd() * tot, spec = specs[0];
  for (let i = 0; i < specs.length; i++) { r -= wts[i]; if (r <= 0) { spec = specs[i]; break; } }
  const p = MH.G.p;
  for (let tries = 0; tries < 40; tries++) {
    const i = L.main[Math.floor(MH.rnd() * L.main.length)], x = i % L.w, y = (i / L.w) | 0;
    if (L.t[i] === MH.T.SHAFT) continue;
    if (L.shafts && L.n === 1 && L.shafts.some(s => MH.cheb(s.x, s.y, x, y) < 10)) continue; // la salle d'entrée reste calme
    if (!first && p.n === L.n && MH.cheb(p.x, p.y, x, y) <= MH.vueOf(p) + 5) continue;
    const size = MH.ri(spec.group[0], L.n === 1 ? Math.min(3, spec.group[1]) : spec.group[1]);
    const free = MH._freeAround(L, x, y, 2); MH.shuffle(free);
    const gid = MH.uid();
    for (let k = 0; k < size && k < free.length; k++) {
      const m = MH.spawnMonster(spec, L.n, free[k][0], free[k][1], gid, first);
      m.home = { x, y };
      if (first && MH.guardTreasure && k === 0) MH.guardTreasure(m);

    return size;
  }
  return 0;
};

MH.populate = function (L) {
  const target = MH.monsterTarget(L.n);
  let count = 0, guard = 0;
  while (count < target && guard++ < 200) count += MH.spawnColony(L, true);

MH.countMonsters = n => MH.G.actors.filter(a => a.kind === 'monster' && a.n === n && !a.dead).length;

/** Appelé à chaque nouveau tour du joueur : le Hall se repeuple lentement. */
MH.worldTick = function () {
  const G = MH.G;

    if (MH.countMonsters(n) < MH.monsterTarget(n) * 0.85 && MH.chance(0.6)) MH.spawnColony(L, false);

/* ---------- Perception & déplacement ---------- */
MH.foesOf = function (m) {

    MH.entsAt(m.n, x, y).forEach(o => {

/** Premier pas d'un plus court chemin (BFS borné) vers (tx,ty). */
MH.stepToward = function (c, tx, ty) {
  const L = MH.G.levels[c.n], R = 9;
  if (c.x === tx && c.y === ty) return null;
  const x0 = c.x - R, y0 = c.y - R, S = 2 * R + 1;

      const nx = cx + dx, ny = cy + dy, lx = nx - x0, ly = ny - y0;
      if (lx < 0 || ly < 0 || lx >= S || ly >= S) continue;
      const li = ly * S + lx; if (seen[li] || !MH.isWalk(L, nx, ny)) continue;
      seen[li] = 1; prev[li] = (cy - y0) * S + (cx - x0);
      if (nx === tx && ny === ty) {

        let cur = li, back = prev[cur];
        while (back !== R * S + R && back !== -1) { cur = back; back = prev[cur]; }

      }

    }

};

MH._monMove = function (m, dx, dy) {
  const chk = MH.canMoveTo(m, dx, dy, 0); if (!chk.ok) return false;
  if (m.kind === 'monster' && MH.tacticAllowMove && !MH.tacticAllowMove(m, chk.nx, chk.ny)) return false;

};

  while (m.pa > 0 && safety-- > 0 && !m.dead) {
    m._fleeing = false;
    if (m.state.down) { if (m.pa >= 2) { MH.spendPA(m, 2); m.state.down = false; continue; } break; }
    const foes = MH.foesOf(m);
    const hurtRaw = m.hp <= MH.hpMaxOf(m) * 0.3 && !m.noflee, morale = !hurtRaw && MH.tacticMorale && MH.tacticMorale(m);
    const hurt = hurtRaw || morale;
    if (morale && !m._fled) { m._fled = true; MH.seenMsg(m, 'sys', `La meute est décimée : ${m.name} détale !`); }
    // fuite
    if (hurt && foes.length) {
      const f = foes.reduce((a, b) => MH.cheb(m.x, m.y, a.x, a.y) <= MH.cheb(m.x, m.y, b.x, b.y) ? a : b);
      let best = null, bd = -1;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const chk = MH.canMoveTo(m, dx, dy, 0); if (!chk.ok) continue;
        const d = MH.cheb(chk.nx, chk.ny, f.x, f.y) + MH.rnd() * 0.5; if (d > bd) { bd = d; best = [dx, dy]; }
      }

      if (!m._fleeMsg) { m._fleeMsg = true; if (best && MH.fleeNotice) MH.fleeNotice(m, best[0], best[1]); }
      if (best && MH._monMove(m, best[0], best[1])) { if (MH.leaveBlood) MH.leaveBlood(m); continue; }
      if (best && MH.moveCost(m, 0) > m.pa) break; // plus assez de PA pour fuir : il souffle, il ne revient pas
      m._fleeing = false;
      // acculé : il se bat
    }
    // cible : même zone d'abord, sinon la plus proche
    let target = null;
    const here = foes.filter(o => o.x === m.x && o.y === m.y);
    const tt = MH.tacticTarget ? MH.tacticTarget(m, foes, here) : undefined;
    if (here.length) target = here.reduce((a, b) => a.hp <= b.hp ? a : b);
    else if (tt !== undefined && m.angry <= 0) target = tt;
    else if (m.beh === 'aggro' || m.angry > 0) {
      if (tt) target = tt;
      else if (foes.length) target = foes.reduce((a, b) => MH.cheb(m.x, m.y, a.x, a.y) <= MH.cheb(m.x, m.y, b.x, b.y) ? a : b);
    }
    if (target && !m._barked && MH.bark && MH.chance(0.35)) { m._barked = true; MH.bark(m, target); }
    if (!target) m._barked = false;
    if (target && target.x === m.x && target.y === m.y) {

      break;
    }
    if (target) {
      const st = MH.stepToward(m, target.x, target.y);
      if (st && MH._monMove(m, st.dx, st.dy)) continue;
      break;
    }
    // errance autour du foyer de la colonie (un seul déplacement par tour)
    if (!m._wandered && MH.chance(0.45)) {

      const opts = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {

/** Les voisins d'une colonie accourent quand l'un des leurs est frappé. */

/* ---------- Génération d'objets ---------- */
MH.pickBase = (list, depth) => list[MH.ri(0, Math.min(list.length - 1, 1 + Math.floor(depth / 2)))];
MH.applyTemplate = function (it, depth) {
  if (!MH.chance(0.42)) return;
  const stats = ['att', 'esq', 'deg', 'reg', 'vue', 'pv', 'arm'].filter(s => it.cat !== 'arme' || s !== 'arm');
  const s = MH.pick(stats), mag = MH.ri(1, 1 + Math.floor(depth / 4));
  const neg = MH.chance(0.2), v = (s === 'pv' ? 5 * mag : mag) * (neg ? -1 : 1);
  it.mod[s] = (it.mod[s] || 0) + v; it.suffix = (neg ? 'maudit ' : '') + MH.TEMPLATES[s]; it.cursed = neg; it.price = Math.max(5, it.price + (neg ? -20 : 40) * mag);
};
MH.makeItem = function (cat, depth) {
  depth = Math.max(1, depth | 0);
  const it = { id: MH.uid(), cat, held: false, ident: false, mod: {}, w: 0, price: 5 };
  const base = { arme: MH.WEAPONS, armure: MH.ARMORS, casque: MH.HELMS, bottes: MH.BOOTS }[cat];
  if (base) {
    const b = MH.pickBase(base, depth); it.kind = b.k; it.mod = Object.assign({}, b.mod); it.w = b.w; it.price = b.price; MH.applyTemplate(it, depth);
  } else if (cat === 'talisman') {
    const s = MH.pick(['att', 'esq', 'deg', 'reg', 'vue', 'pv']), mag = MH.ri(1, 1 + Math.floor(depth / 5));
    it.kind = 'Talisman'; it.mod[s] = s === 'pv' ? 5 * mag : mag; it.suffix = MH.TEMPLATES[s]; it.w = 2; it.price = 40 * mag;
    if (MH.chance(0.15)) { it.mod[s] = -it.mod[s]; it.cursed = true; it.suffix = 'maudit ' + it.suffix; it.price = 5; }
  } else if (cat === 'potion') {
    const types = MH.POTION_TYPES, t = MH.chance(0.78) ? types[MH.ri(0, 4)] : types[MH.ri(5, 6)];
    it.ptype = t.id; it.w = 3; it.price = t.price; it.tint = MH.G && MH.G.potionColor ? MH.G.potionColor[t.id] : '#c0392b';
  } else if (cat === 'parchemin') {
    if (MH.chance(0.55)) {
      const sp = Object.values(MH.TALENTS).filter(T => T.type === 'sort' && T.scroll);
      const T = MH.pick(sp); it.sub = 'sort'; it.spell = T.id; it.price = 45 + T.cost * 15;
    } else { const s = MH.chance(0.85) ? MH.MAGIC_SCROLLS[MH.ri(0, 2)] : MH.MAGIC_SCROLLS[3]; it.sub = 'magique'; it.mscroll = s.id; it.price = s.price; }
    it.w = 2;
  } else if (cat === 'champignon') {
    const m = MH.chance(0.1) ? MH.MUSHROOMS[4] : MH.MUSHROOMS[MH.ri(0, 3)]; it.mtype = m.id; it.tint = m.tint; it.w = 1; it.price = 8; it.ident = true;
  }
  return it;
};
MH.CAT_WEIGHTS = [['gg', 26], ['potion', 20], ['parchemin', 10], ['arme', 8], ['armure', 6], ['casque', 5], ['bottes', 5], ['talisman', 5], ['composant', 8]];
MH.randCat = function () { let t = 0; MH.CAT_WEIGHTS.forEach(c => t += c[1]); let r = MH.rnd() * t; for (const [c, w] of MH.CAT_WEIGHTS) { r -= w; if (r <= 0) return c; } return 'gg'; };
MH.makeFloorItem = function (depth) {

MH.initTreasure = function (G) {

  MH.POTION_TYPES.forEach((t, i) => { G.potionColor[t.id] = cols[i][1]; G.potionName[t.id] = cols[i][0]; });

MH.scatterItems = function (L) {
  const n = L.n, count = 13 + n * 2;
  for (let k = 0, g = 0; k < count && g < 400; g++) {
    const i = L.main[Math.floor(MH.rnd() * L.main.length)]; if (L.t[i] === MH.T.SHAFT) continue;
    MH.dropItem(n, i % L.w, (i / L.w) | 0, MH.makeFloorItem(n)); k++;
  }

  let m = 0; for (let g = 0; g < 600 && m < 4 + n; g++) {
    const i = L.main[Math.floor(MH.rnd() * L.main.length)];
    if (L.t[i] === MH.T.MOSS) { MH.dropItem(n, i % L.w, (i / L.w) | 0, MH.makeItem('champignon', n)); m++; }
  }

/** Le Hall se regarnit : un nouvel objet de temps en temps, hors de vue du joueur. */
MH.replenishItems = function () {
  const G = MH.G;

    const n = MH.ri(1, MH.LEVELS_MAX), L = G.levels[n]; if (!L) continue;
    const i = L.main[Math.floor(MH.rnd() * L.main.length)], x = i % L.w, y = (i / L.w) | 0;
    if (L.t[i] === MH.T.SHAFT || (G.p.n === n && MH.cheb(G.p.x, G.p.y, x, y) <= 8)) continue;
    let cnt = 0; L.items.forEach(a => { cnt += a.length; }); if (cnt > 40 + n * 6) continue;

  }
};

/** Butin d'un monstre mort [OFF : « parfois un trésor, un composant et/ou des GG' »]. */
MH.genLoot = function (m) {

    let cat = MH.randCat(); if (cat === 'gg' || cat === 'composant') cat = MH.pick(['potion', 'arme', 'armure', 'casque', 'bottes', 'talisman', 'parchemin', 'potion']);
    MH.dropItem(m.n, m.x, m.y, MH.makeItem(cat, Math.max(m.n, Math.ceil(m.lvl / 2)), m.lvl >= 12 ? { boost: 1.3, deep: 1.5, mithril: 1.5 } : null));
  }

};

/* ---------- Affichage des noms ---------- */
MH.signed = v => (v > 0 ? '+' : '') + v;

MH.itemName = function (it) {
  const G = MH.G;
  if (it.cat === 'gg') return `${it.amount} GG'`;
  if (!it.held) {
    if (it.cat === 'champignon') return `Champignon ${MH.MUSHROOMS.find(m => m.id === it.mtype).name}`;
    return MH.CAT_LABEL[it.cat] || it.cat;
  }
  switch (it.cat) {
    case 'arme': case 'armure': case 'casque': case 'bottes': case 'talisman':
      return it.kind + (it.ident ? (it.suffix ? ' ' + it.suffix : '') + (Object.keys(it.mod).length ? ` (${MH.modText(it.mod)})` : '') : ' (?)');
    case 'potion': return (G.knownPotion[it.ptype] || it.sold) ? `Potion ${MH.POTION[it.ptype].name}` : `Potion ${G.potionName[it.ptype]}`;
    case 'parchemin':
      if (it.ident || (it.sub === 'magique' && G.knownScroll[it.mscroll])) return it.sub === 'sort' ? `Parchemin : ${MH.TALENTS[it.spell].name}` : `Parchemin ${MH.MSCROLL[it.mscroll].name}`;
      return it.sub === 'sort' ? 'Parchemin (?)' : 'Parchemin (?)';
    case 'composant': return `${it.part} de ${it.from}`;
    case 'champignon': return `Champignon ${MH.MUSHROOMS.find(m => m.id === it.mtype).name}`;
  }
  return it.name || it.cat;
};

/* ---------- Actions ---------- */
MH.actRafler = function (c, pa) {
  if (pa < 2 || pa > 6) return { ok: false, msg: 'Rafler : 2 à 6 PA.' };
  if (pa > c.pa) return { ok: false, msg: `Il te reste ${c.pa} PA.` };
  const items = MH.itemsAt(c.n, c.x, c.y).slice();
  if (!items.length) return { ok: false, msg: 'Rien à rafler ici.' };
  const n = MH.d(pa - 1, 3) + pa; // 2 PA : 1D3+2 … 6 PA : 5D3+6 [OFF]
  MH.spendPA(c, pa);
  MH.shuffle(items); let got = 0, gg = 0;
  for (const it of items.slice(0, n)) {
    MH.takeItem(c.n, c.x, c.y, it); got++;
    if (it.cat === 'gg') { c.gg += it.amount; gg += it.amount; } else { it.held = true; c.inv.push(it); }
  }
  MH.msg('loot', `Tu rafles ${got} objet(s)${gg ? ` dont ${gg} GG'` : ''}.`);
  return { ok: true };
};
const _pickup0 = MH.actPickup;

MH.findItem = (c, id) => (c.inv || []).find(i => i.id === id) || Object.values(c.equip || {}).find(i => i && i.id === id) || null;

MH.actEquip = function (c, it) {
  const slot = MH.SLOT_OF[it.cat]; if (!slot) return { ok: false, msg: 'Cet objet ne s\'équipe pas.' };
  const cost = MH.EQUIP_COST[slot];
  if (c.pa < cost) return { ok: false, msg: `Équiper coûte ${cost} PA.` };
  if (c.state.down) return { ok: false, msg: 'Tu es à terre.' };
  const i = c.inv.indexOf(it); if (i < 0) return { ok: false, msg: 'Objet introuvable.' };
  MH.spendPA(c, cost);
  const old = c.equip[slot]; c.inv.splice(i, 1);
  if (old) c.inv.push(old);
  c.equip[slot] = it; MH.recalc(c);
  MH.msg('loot', `Tu équipes : ${MH.itemName(it)}.${it.cursed && it.ident ? ' (maudit…)' : ''}`);
  if (!it.ident && Object.keys(it.mod).length) {
    // les effets sont ressentis : un bonus/malus notable révèle l'objet un peu
    const bad = Object.values(it.mod).some(v => v < 0);
    MH.msg('sys', bad ? 'Quelque chose ne te semble pas tout à fait normal…' : 'Tu te sens un peu différent.');
  }
  return { ok: true };
};
MH.actUnequip = function (c, slot) {
  const it = c.equip[slot]; if (!it) return { ok: false, msg: 'Rien à retirer.' };
  const cost = MH.EQUIP_COST[slot]; if (c.pa < cost) return { ok: false, msg: `Retirer coûte ${cost} PA.` };
  MH.spendPA(c, cost); delete c.equip[slot]; c.inv.push(it); MH.recalc(c);

MH.actDrop = function (c, it) {

/** Potion / parchemin : 2 PA, sur soi ou sur une créature de la zone [OFF]. */
MH.actUseItem = function (c, it, tgt) {
  if (c.pa < 2) return { ok: false, msg: 'Utiliser coûte 2 PA.' };
  const i = c.inv.indexOf(it); if (i < 0) return { ok: false, msg: 'Objet introuvable.' };
  if (c.state.intang > 0 && tgt && tgt !== c) return { ok: false, msg: 'Tu es intangible.' };
  const G = MH.G;
  if (it.cat === 'potion') {
    const T = MH.POTION[it.ptype]; MH.spendPA(c, 2); c.inv.splice(i, 1);
    const who = tgt && tgt !== c ? tgt : c;
    if (who !== c && (who.n !== c.n || who.x !== c.x || who.y !== c.y)) { return { ok: false, msg: 'La cible doit être sur ta zone.' }; }
    const first = !G.knownPotion[it.ptype]; G.knownPotion[it.ptype] = true;
    MH.msg('xp', `${who === c ? 'Tu bois' : 'Tu lances'} une potion ${T.name}${first ? ' (désormais identifiée)' : ''}.`);
    if (who !== c && who.kind === 'monster') { who.angry = 6; }
    if (who !== c && T.id === 'poison') { const l = MH.d(3, 3) + 2; who.hp -= l; MH.msg('hit', `${who.name} subit ${l} dégâts de poison.`); MH.fx(who, '-' + l, '#9acd32'); if (who.hp <= 0) MH.kill(who, c); }
    else if (who !== c && T.bad) { MH.addBuff(who, 'esq', -2, 2, 'pot_bad'); MH.msg('hit', `${who.name} semble hébété.`); }
    else T.run(who);
    c.turn.used['_item'] = 1; return { ok: true };
  }
  if (it.cat === 'parchemin') {
    MH.spendPA(c, 2); c.inv.splice(i, 1);
    if (it.sub === 'magique') { const S = MH.MSCROLL[it.mscroll]; G.knownScroll[it.mscroll] = true; MH.msg('xp', `Tu lis un parchemin ${S.name}.`); S.run(c); return { ok: true }; }
    const T = MH.TALENTS[it.spell];
    if (T.target === 'zone' || T.target === 'view') {
      if (!tgt || tgt.dead || c.n === 0 || !MH.canSee(c, tgt) || (T.target === 'zone' && (tgt.x !== c.x || tgt.y !== c.y))) { MH.msg('sys', 'Le parchemin se consume sans effet (pas de cible valide).'); return { ok: true }; }
    }
    if (MH.ri(1, 100) > 90) { MH.msg('sys', `Parchemin : ${T.name} — la formule se brouille et le parchemin s'évapore.`); return { ok: true }; }
    MH.msg('xp', `Tu lis le parchemin : ${T.name} (90 %).`);
    if (T.aggr) { c.state.invis = false; c.state.camo = false; }
    T.run(c, tgt); return { ok: true };
  }
  return { ok: false, msg: 'Cet objet ne s\'utilise pas.' };
};
/** Apprendre un sortilège depuis un parchemin : 5 PA. */

  else if (r <= 90) { c.pa = Math.max(0, c.pa - 1); MH.msg('hurt', 'Le ventre noué : −1 PA.'); }
  else if (r <= 97) { c.pxPer += 5; MH.msg('xp', 'Étonnamment nourrissant : +5 PX personnels.'); }
  else { c.hpMax += 1; c.hp += 1; MH.msg('lvl', 'Ton estomac blindé s\'élargit : +1 PV maximum à vie !'); }
  if (c.goinfre >= 3 && !c._armHint) { c._armHint = true; MH.msg('sys', 'Tu as assez goinfré pour améliorer ton armure naturelle (onglet Évolution).'); }
  return { ok: true };
};

/* Identification des Trésors (sort) */
MH.identifyOne = function (c) {

};

/** Mort : risque de perdre l'équipement non porté (plus c'est lourd, moins on a de chances de le garder) [OFF]. */
MH.deathLosses = function (p) {
  const lost = [];
  p.inv = p.inv.filter(it => {
    const pLose = Math.min(0.75, 0.2 + (it.w || 0) / 120);
    if (MH.chance(pLose)) { lost.push(it); return false; } return true;
  });
  lost.forEach(it => MH.dropItem(p.n, p.x, p.y, it));
  if (lost.length) MH.msg('death', `Tu perds ${lost.length} objet(s) non porté(s) : ${lost.slice(0, 4).map(i => MH.itemName(i)).join(', ')}${lost.length > 4 ? '…' : ''}.`);
};

/* ===== 36_society.js ===== */
'use strict';
/* ==========================================================================
   Société : trolls rivaux simulés (les « autres joueurs »), classement,
   messagerie, dons de PX, guildes.   [EXTRA] : tout le comportement des rivaux
   est inventé ; seules les règles de combat/progression sont [OFF].
   ========================================================================== */
MH.RIVAL_NAMES = ['Gruntak', 'Zorgol', 'Brakka', 'Mogdar', 'Thrunk', 'Skarn', 'Ulgra', 'Durnak', 'Grishnak', 'Vorka', 'Hazgul', 'Bolgrim', 'Narzug', 'Kralmoth', 'Tuvok le Gras', 'Ogrid', 'Mazdûr', 'Pétrok', 'Yggla', 'Hurlefange', 'Brûlecuir', 'Mâchepierre', 'Gorbag', 'Snaga', 'Dromm', 'Ikthar', 'Lurtz', 'Wuldrak', 'Zéphor', 'Krokmou'];
MH.GUILD_NAMES = ['Les Ours du Gouffre', 'L\'Ordre des Lames Rouges', 'Les Fils de Pierre', 'La Confrérie des Champignons'];
MH.MOODS = { brute: 'Brute', rapace: 'Rapace', pacifique: 'Pacifique' };
const SOC_DEF = () => ({ rivals: [], mail: [], news: [], guilds: [], nextMail: 1, sort: 'lvl' });

/* ---------- utilitaires ---------- */
MH.soc = () => MH.G.soc;
MH.rivals = () => MH.G.soc.rivals;
MH.trollById = id => (MH.G.p.id === id ? MH.G.p : MH.G.soc.rivals.find(r => r.id === id));
MH.depthPref = c => Math.max(1, Math.min(MH.LEVELS_MAX, Math.ceil(c.lvl * 0.6)));
MH.news = function (txt) { const S = MH.G.soc; S.news.unshift({ t: MH.G.time, txt }); if (S.news.length > 60) S.news.length = 60; };
MH.sendMail = function (from, subj, body, delay, extra) {
  const S = MH.G.soc;
  S.mail.push(Object.assign({ id: S.nextMail++, from: from.name, fromId: from.id, subj, body, t: MH.G.time + (delay || 0), read: false }, extra || {}));
};
MH.unreadCount = () => MH.G.soc ? MH.G.soc.mail.filter(m => !m.read && m.t <= MH.G.time).length : 0;
const SYSTEM = { name: 'La Gazette du Hall', id: 0 };

/* ---------- création d'un rival ---------- */
const GROW_W = { att: 3, esq: 3, deg: 3, pv: 2, reg: 1, vue: 0.4, tps: 1.2 };
MH.autoGrow = function (c, free) {
  for (let g = 0; g < 14; g++) {
    if (free) c.pa = Math.max(c.pa, 6);
    if (c.pa >= 2 && c.pxPub + c.pxPer > 0) { MH.actTrain(c); continue; }
    if (c.pa < 5) break;
    const opts = Object.keys(GROW_W).filter(k => c.pi >= MH.improveCost(c, k));
    if (!opts.length) break;
    // préfère les améliorations bon marché, pondérées par le profil
    let tot = 0; const w = opts.map(k => { const x = GROW_W[k] * (c.mood === 'brute' && (k === 'att' || k === 'deg') ? 1.6 : 1) / MH.improveCost(c, k); tot += x; return x; });
    let r = MH.rnd() * tot, key = opts[0]; for (let i = 0; i < opts.length; i++) { r -= w[i]; if (r <= 0) { key = opts[i]; break; } }
    MH.actImprove(c, key);
  }
};
MH.relocate = function (c, n) {
  const G = MH.G, p = G.p;
  n = Math.max(1, Math.min(MH.LEVELS_MAX, n));
  const L = G.levels[n];
  for (let tries = 0; tries < 60; tries++) {
    const i = L.main[Math.floor(MH.rnd() * L.main.length)], x = i % L.w, y = (i / L.w) | 0;
    if (L.t[i] === MH.T.SHAFT) continue;
    if (p.n === n && MH.cheb(p.x, p.y, x, y) <= MH.vueOf(p) + 6) continue;
    if (n === 1 && L.shafts && L.shafts.some(s => MH.cheb(s.x, s.y, x, y) < 10)) continue;
    MH.moveEntTo(c, x, y, n); return true;
  }
  return false;
};
MH.makeRival = function (name, race, lvl, mood) {
  const G = MH.G, c = MH.newTroll(name, race);
  c.mood = mood; c.grudge = {}; c.guild = null; c.restTurns = 0;
  MH.initTalents(c);
  c.piTotal = MH.piForLevel(lvl) + MH.ri(0, Math.max(1, lvl * 3)); c.pi = c.piTotal; c.lvl = MH.levelFromPI(c.piTotal);
  for (let i = 1; i < c.lvl; i++) c.mouches.push(MH.pick(['att', 'esq', 'deg', 'reg']));
  MH.recalc(c);
  MH.autoGrow(c, true);
  const depth = MH.depthPref(c);
  ['arme', 'armure', 'casque', 'bottes'].forEach(cat => {
    if (!MH.chance(0.35 + 0.08 * c.lvl)) return;
    const it = MH.makeItem(cat, depth); if (it.cursed) return;
    it.ident = true; c.equip[MH.SLOT_OF[cat]] = it;
  });
  MH.recalc(c); c.hp = MH.hpMaxOf(c);
  c.gg = MH.ri(0, 20 * c.lvl);
  c.dla = MH.ri(1, 720);
  c.state.down = false;
  G.actors.push(c); G.soc.rivals.push(c);
  MH.relocate(c, depth);
  return c;
};
MH.initSociety = function () {
  const G = MH.G; G.soc = SOC_DEF();
  const lvls = [1, 1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 5, 5, 6, 7, 8, 9, 11];
  const races = Object.keys(MH.RACES), names = MH.RIVAL_NAMES.slice(); MH.shuffle(names);
  const moods = ['brute', 'brute', 'rapace', 'rapace', 'rapace', 'pacifique', 'pacifique', 'pacifique', 'pacifique'];
  lvls.forEach((L, i) => MH.makeRival(names[i], races[i % races.length], L, moods[i % moods.length]));
  // guildes : les 4 plus hauts niveaux non-brutes fondent une guilde, quelques recrues
  const sorted = G.soc.rivals.slice().sort((a, b) => b.lvl - a.lvl);
  const leaders = sorted.filter(r => r.mood !== 'brute').slice(0, MH.GUILD_NAMES.length);
  leaders.forEach((ld, i) => {
    const gd = { id: i + 1, name: MH.GUILD_NAMES[i], leader: ld.id, members: [ld.id] };
    G.soc.guilds.push(gd); ld.guild = gd.id;
  });
  G.soc.rivals.forEach(r => { if (r.guild == null && G.soc.guilds.length && MH.chance(0.55)) { const gd = MH.pick(G.soc.guilds); r.guild = gd.id; gd.members.push(r.id); } });
  G.soc.nextGuild = 10;
  G.p.guild = null; G.p.grudge = {};
  MH.sendMail(SYSTEM, 'Bienvenue au Hall', `Le Monde Souterrain compte ${G.soc.rivals.length + 1} Trõlls actifs. Surveille le classement, méfie-toi des brutes… et trouve-toi une guilde.`, 0);
};

/* ---------- hostilité entre trolls ---------- */
MH.trollHostile = function (a, b) {
  const dir = (x, y) => {
    if (x.isPlayer || y.n === 0 || x.n === 0) return false;
    if (x.guild != null && x.guild === y.guild) return false;
    const g = x.grudge && x.grudge[y.id]; if (g && g > MH.G.time) return true;
    if (x.mood === 'brute') return y.lvl <= x.lvl + 2;
    if (x.mood === 'rapace') return y.lvl <= x.lvl + 1 && y.hp <= MH.hpMaxOf(y) * 0.5;
    return false;
  };
  if (a.kind === 'troll' && b.kind === 'troll') return dir(a, b) || dir(b, a);
  return false;
};
const _ohSoc = MH.onHit;
MH.onHit = function (a, d, r) {
  if (_ohSoc) _ohSoc(a, d, r);
  if (d.kind === 'troll' && !d.isPlayer && a.kind === 'troll') {
    d.grudge = d.grudge || {}; d.grudge[a.id] = MH.G.time + 6 * MH.TURN_MIN;
    if (a.isPlayer && d.guild != null) { const gd = MH.G.soc.guilds.find(g => g.id === d.guild); const ld = gd && MH.trollById(gd.leader); if (ld && !ld.isPlayer) ld.grudge[a.id] = Math.max(ld.grudge[a.id] || 0, MH.G.time + 3 * MH.TURN_MIN); }
  }
};

/* ---------- mort / résurrection d'un rival ---------- */
MH.trollDeath = function (v, killer) {
  const G = MH.G, p = G.p;
  if (v.dead) return;
  v.deaths++;
  const kn = killer ? killer.name : 'la fatalité';
  if (killer && killer.kind === 'troll') {
    const px = MH.killPX(killer.lvl, v.lvl);
    killer.pxPub += px; killer.kills++;
    if (killer.isPlayer) { G.stats.kills++; MH.msg('xp', `${v.name} est terrassé ! Tu gagnes ${px} PX (redistribuables).`); }
    else if (MH.onTrollKill) MH.onTrollKill(killer, v, px);
  }
  const lostGG = Math.floor(v.gg * MH.ri(30, 50) / 100); v.gg -= lostGG;
  if (lostGG > 0) MH.dropItem(v.n, v.x, v.y, { id: MH.uid(), cat: 'gg', amount: lostGG, w: 0 });
  v.inv = v.inv.filter(it => { if (MH.chance(0.4)) { MH.dropItem(v.n, v.x, v.y, it); return false; } return true; });
  v.pxPub = 0; v.pxPer = 0;
  const seen = p.n === v.n && MH.cheb(p.x, p.y, v.x, v.y) <= MH.vueOf(p);
  if (seen && killer !== p) MH.msg('sys', `☠ ${v.name} est tué par ${kn} !`);
  MH.fx(v, '☠', '#ffd24a', true);
  MH.news(`${v.name} (niv.${v.lvl}) a été terrassé par ${kn}.`);
  if (killer === p && v.mood !== 'pacifique') {
    v.grudge[p.id] = G.time + 10 * MH.TURN_MIN;
    MH.sendMail(v, 'Tu me le paieras', MH.pick([`Tu crois que c'est fini ? Je reviendrai plus fort, ${p.name}.`, `Un jour tu dormiras mal, ${p.name}. Je t'ai à l'œil.`, `Belle frappe. La prochaine sera pour moi.`]), 360);
  } else if (killer === p) {
    MH.sendMail(v, 'Sans rancune', `Bien joué, ${p.name}. Ça arrive aux meilleurs. Je te paierai une chope à l'auberge.`, 360);
  }
  // résurrection en surface
  v.hp = Math.max(1, Math.ceil(MH.hpMaxOf(v) * 0.3));
  v.state = { down: false, camo: false, invis: false, glue: 0, intang: 0 };
  v.buffs = []; v.turn = { malusEsq: 0, malusArm: 0, conc: 0, used: {} };
  MH.toVillage(v); v.restTurns = 1 + MH.ri(0, 1);
};
MH.toVillage = function (c) {
  const L = MH.G.levels[0], sp = L.spawn;
  for (let t = 0; t < 40; t++) {
    const x = sp.x + MH.ri(-6, 6), y = sp.y + MH.ri(-6, 4);
    if (MH.isWalk(L, x, y)) { MH.moveEntTo(c, x, y, 0); return; }
  }
  MH.moveEntTo(c, sp.x, sp.y, 0);
};
MH.onTrollKill = function (killer, victim, px) { /* hook : stats futures */ };
MH.onLevelUp = function (c) {
  if (c.lvl >= 3) MH.news(`${c.name} le ${MH.RACES[c.race].name} atteint le niveau ${c.lvl}.`);
};

/* ---------- IA : tour d'un rival ---------- */
MH.trollAI = function (c) {
  if (c.dead || c.isPlayer) return;
  const p = MH.G.p;
  if (c.n === 0) return surfaceTurn(c);
  if (c.n === p.n && p.n !== 0) return concreteTurn(c);
  abstractTurn(c);
};

function surfaceTurn(c) {
  c.hp = Math.min(MH.hpMaxOf(c), c.hp + Math.ceil(MH.hpMaxOf(c) * 0.35)); // soins de Mama-Gluc
  MH.autoGrow(c, true);
  if (c.gg >= 90 && MH.chance(0.5)) { // un peu de shopping
    const cat = MH.pick(['arme', 'armure', 'casque', 'bottes']), it = MH.makeItem(cat, MH.depthPref(c)), slot = MH.SLOT_OF[cat];
    if (!it.cursed) { const sum = x => x ? Object.values(x.mod).reduce((s, v) => s + v, 0) : -1; if (sum(it) > sum(c.equip[slot])) { it.ident = true; c.equip[slot] = it; c.gg -= 80; MH.recalc(c); } }
  }
  const L = MH.G.levels[0], dx = MH.ri(-1, 1), dy = MH.ri(-1, 1);
  if (MH.isWalk(L, c.x + dx, c.y + dy) && !MH.placeAt(0, c.x + dx, c.y + dy)) MH.moveEntTo(c, c.x + dx, c.y + dy, 0);
  if (--c.restTurns <= 0 && c.hp >= MH.hpMaxOf(c) * 0.9) MH.relocate(c, MH.depthPref(c) + MH.ri(-1, 0));
}

function abstractTurn(c) {
  const G = MH.G, pref = MH.depthPref(c);
  if (c.n !== pref && MH.chance(0.35)) MH.relocate(c, c.n < pref ? c.n + 1 : c.n - 1);
  const hpMax = MH.hpMaxOf(c);
  if (c.hp < hpMax * 0.5) { c.hp = Math.min(hpMax, c.hp + Math.ceil(hpMax * 0.15)); }
  else if (MH.chance(0.25)) {
    const cand = G.actors.filter(m => m.kind === 'monster' && !m.dead && m.n === c.n && m.lvl <= c.lvl + 2 && m.lvl >= c.lvl - 4);
    if (cand.length) {
      const m = MH.pick(cand), dl = c.lvl - m.lvl;
      const pw = Math.max(0.15, Math.min(0.97, 0.66 + 0.1 * dl));
      c.hp -= Math.round(hpMax * (0.05 + MH.rnd() * 0.25) * Math.max(0.4, 1.2 - dl * 0.08));
      if (c.hp > 0 && MH.chance(pw)) {
        m.dead = true; MH.unplaceEnt(m); const i = G.actors.indexOf(m); if (i >= 0) G.actors.splice(i, 1);
        c.pxPub += MH.killPX(c.lvl, m.lvl) + 1; c.kills++; c.gg += MH.ri(Math.max(1, m.lvl), m.lvl * 3 + 3);
      } else if (c.hp <= 0 && MH.chance(0.5)) { MH.kill(c, m); return; }
      else c.hp = Math.max(1, Math.min(c.hp, Math.ceil(hpMax * 0.25)));
    }
  }
  MH.autoGrow(c, true);
}

function wantFight(c, o) {
  const hpF = c.hp / MH.hpMaxOf(c);
  if (o.kind === 'monster') return o.lvl <= c.lvl + (c.mood === 'brute' ? 3 : 1) && hpF > 0.35;
  return hpF > 0.4 && o.lvl <= c.lvl + 3;
}
function concreteTurn(c) {
  const G = MH.G;
  let foes = MH.foesOf(c);
  if (!foes.length) MH.autoGrow(c, false);
  let safety = 14;
  while (c.pa > 0 && safety-- > 0 && !c.dead && c.n !== 0) {
    if (c.state.down) { if (c.pa >= 2) { MH.spendPA(c, 2); c.state.down = false; continue; } break; }
    foes = MH.foesOf(c);
    const hurt = c.hp <= MH.hpMaxOf(c) * 0.35;
    const here = foes.filter(o => o.x === c.x && o.y === c.y);
    if (hurt && foes.length) {
      const f = foes.reduce((a, b) => MH.cheb(c.x, c.y, a.x, a.y) <= MH.cheb(c.x, c.y, b.x, b.y) ? a : b);
      let best = null, bd = -1;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const chk = MH.canMoveTo(c, dx, dy, 0); if (!chk.ok) continue;
        const d = MH.cheb(chk.nx, chk.ny, f.x, f.y) + MH.rnd() * 0.5; if (d > bd) { bd = d; best = [dx, dy]; }
      }
      if (best && MH.moveCost(c, 0) <= c.pa && MH._monMove(c, best[0], best[1])) continue;
      if (here.length && c.pa >= 4) { MH.actAttack(c, here.reduce((a, b) => a.hp <= b.hp ? a : b)); continue; }
      break;
    }
    if (hurt) break; // se repose
    let target = null;
    const hereW = here.filter(o => wantFight(c, o) || o.kind === 'monster');
    if (hereW.length) target = hereW.reduce((a, b) => a.hp <= b.hp ? a : b);
    else {
      const w = foes.filter(o => wantFight(c, o));
      if (w.length) target = w.reduce((a, b) => MH.cheb(c.x, c.y, a.x, a.y) <= MH.cheb(c.x, c.y, b.x, b.y) ? a : b);
    }
    if (target && target.x === c.x && target.y === c.y) { if (c.pa >= 4) { MH.actAttack(c, target); continue; } break; }
    if (target) { const st = MH.stepToward(c, target.x, target.y); if (st && MH.moveCost(c, 0) <= c.pa && MH._monMove(c, st.dx, st.dy)) continue; break; }
    // ramasse l'or au sol puis explore
    const gg = MH.itemsAt(c.n, c.x, c.y).find(i => i.cat === 'gg');
    if (gg && c.pa >= 1) { MH.spendPA(c, 1); MH.takeItem(c.n, c.x, c.y, gg); c.gg += gg.amount; continue; }
    if (MH.chance(0.15)) { c.head = null; }
    if (!c.head) c.head = [MH.ri(-1, 1), MH.ri(-1, 1)];
    let moved = false;
    if (c.head[0] || c.head[1]) {
      const chk = MH.canMoveTo(c, c.head[0], c.head[1], 0);
      if (chk.ok && G.levels[c.n].t[chk.ny * G.levels[c.n].w + chk.nx] !== MH.T.SHAFT && MH.moveCost(c, 0) <= c.pa) moved = MH._monMove(c, c.head[0], c.head[1]);
    }
    if (!moved) { c.head = null; break; }
  }
}

/* ---------- tick monde : duels entre rivaux, invitations, courrier ---------- */
const _wtSoc = MH.societyTick;
MH.societyTick = function () {
  if (_wtSoc) _wtSoc();
  const G = MH.G, S = G.soc, p = G.p; if (!S) return;
  // duel rival contre rival hors de la vue du joueur
  if (MH.chance(0.3)) {
    const live = S.rivals.filter(r => !r.dead && r.n >= 1 && r.n !== p.n && r.hp > MH.hpMaxOf(r) * 0.4);
    const a = live.length ? MH.pick(live.filter(r => r.mood === 'brute' || r.mood === 'rapace').concat(live.slice(0, 1))) : null;
    const foes = a ? live.filter(r => r !== a && r.n === a.n && MH.trollHostile(a, r)) : [];
    if (a && foes.length) {
      const b = MH.pick(foes), pw = Math.max(0.1, Math.min(0.9, 0.5 + 0.1 * (a.lvl - b.lvl) + (MH.rnd() - 0.5) * 0.2));
      const [w, l] = MH.chance(pw) ? [a, b] : [b, a];
      w.hp = Math.max(1, w.hp - Math.round(MH.hpMaxOf(w) * (0.1 + MH.rnd() * 0.3)));
      if (MH.chance(0.65)) MH.trollDeath(l, w); else l.hp = Math.max(1, Math.ceil(MH.hpMaxOf(l) * 0.25));
    }
  }
  // invitations de guilde
  if (p.guild == null && p.lvl >= 3 && S.guilds.length && MH.chance(0.06) && !S.mail.some(m => m.invite && !m.read)) {
    const gd = MH.pick(S.guilds.filter(g => { const l = MH.trollById(g.leader); return l && !(l.grudge && l.grudge[p.id] > G.time); }));
    if (gd) { const ld = MH.trollById(gd.leader); MH.sendMail(ld, `Invitation : ${gd.name}`, `Salut ${p.name}. On a entendu parler de tes exploits. ${gd.name} t'ouvre ses portes — rejoins-nous (2 PA, pas de menu spécial).`, 0, { invite: gd.id }); }
  }
  // les pacifiques rejoignent la guilde du joueur
  const pg = p.guild != null && S.guilds.find(g => g.id === p.guild);
  if (pg && pg.leader === p.id && MH.chance(0.05)) {
    const free = S.rivals.filter(r => r.guild == null && r.mood === 'pacifique');
    if (free.length) { const r = MH.pick(free); r.guild = pg.id; pg.members.push(r.id); MH.news(`${r.name} rejoint ${pg.name}.`); MH.sendMail(r, 'Candidature acceptée', `Chef, je viens de rejoindre ${pg.name}. Fier d'être des tiens !`, 0); }
  }
  // mise à jour de la rancune : elle s'éteint avec le temps (vérifiée à l'usage)
  // le courrier d'un rival mort peut attendre sa résurrection : rien à faire
};

/* ---------- classement ---------- */
MH.ranking = function (sort) {
  const G = MH.G, all = [G.p].concat(G.soc.rivals);
  const key = { lvl: t => [t.lvl, t.piTotal], kills: t => [t.kills, t.lvl], deaths: t => [t.deaths, -t.lvl] }[sort || 'lvl'] || (t => [t.lvl, t.piTotal]);
  all.sort((a, b) => { const x = key(a), y = key(b); return (y[0] - x[0]) || (y[1] - x[1]) || (a.id - b.id); });

};

'use strict';
/* ==========================================================================
   Butin : templates multiples, mithril, composants (taille + qualité)

         entière de 10 de poids) ; nombre de templates limité par type
         (arme 1 main : 3, arme 2 mains : 6) ; le mithril peut occuper la
         place d'un template.
   [EXTRA] raretés : template simple ~35 %, double ~8 %, triple <1 % ;
           mithril ~3-12 % selon la profondeur ; places des autres types.
   ========================================================================== */
(function () {
  const STAT_NAMES = ['att', 'esq', 'deg', 'reg', 'vue', 'pv', 'arm'];
  MH.QUAL = ['très mauvaise', 'mauvaise', 'moyenne', 'bonne', 'très bonne'];
  MH.SIZE = ['petit', 'moyen', 'gros'];
  MH.isEquipCat = cat => cat === 'arme' || cat === 'armure' || cat === 'casque' || cat === 'bottes';

  const baseOf = it => { const list = { arme: MH.WEAPONS, armure: MH.ARMORS, casque: MH.HELMS, bottes: MH.BOOTS }[it.cat]; return list && list.find(b => b.k === it.kind); };
  MH.maxTemplates = it => it.cat === 'arme' ? (it.kind === 'Épée à deux mains' ? 6 : 3) : it.cat === 'armure' ? 3 : (it.cat === 'casque' || it.cat === 'bottes') ? 2 : 0;
  MH.templateCount = it => (it.templates || []).length;
  MH.freeSlots = it => Math.max(0, MH.maxTemplates(it) - MH.templateCount(it) - (it.mithril ? 1 : 0));
  MH.templateStats = it => STAT_NAMES.filter(s => it.cat !== 'arme' || s !== 'arm');

  const tplName = t => (t.neg ? 'maudit ' : '') + MH.TEMPLATES[t.s];
  MH.suffixOf = it => {
    const n = (it.templates || []).map(tplName);
    return n.length <= 1 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' et ' + n[n.length - 1];
  };
  /** ajoute un template (stat s, valeur v) en recalculant bonus, nom et prix */
  MH.addTemplate = function (it, s, v) {
    it.templates = it.templates || []; const neg = v < 0, mag = Math.abs(s === 'pv' ? v / 5 : v);
    it.templates.push({ s, v, neg }); it.mod[s] = (it.mod[s] || 0) + v;
    it.suffix = MH.suffixOf(it); if (neg) it.cursed = true;
    const k = it.templates.length; it.price = Math.max(5, it.price + (neg ? -20 : 40 * mag * (1 + 0.5 * (k - 1))));
  };
  MH.makeMithril = function (it) {
    it.mithril = true; it.w = Math.max(1, Math.round(it.w - 2.5 * Math.floor(it.w / 10))); it.price = Math.round(it.price * 2.2);
  };

  /* ---- génération : remplace la version à template unique ---- */
  MH.applyTemplate = function (it, depth) {
    const o = MH._lo || {}, base = baseOf(it);
    if (base && base.m && !it.mithril && MH.maxTemplates(it) - 1 >= (o.minTpl || 0) && MH.chance(Math.min(0.15, (0.03 + 0.006 * depth) * (o.mithril || 1)))) MH.makeMithril(it);
    const slots = MH.freeSlots(it); if (slots <= 0) return;
    let n = 0;
    if (MH.chance(Math.min(0.9, Math.min(0.5, 0.30 + 0.012 * depth) * (o.boost || 1)))) {
      n = 1;
      if (MH.chance(Math.min(0.8, 0.22 * (o.deep || 1)))) { n = 2; if (MH.chance(Math.min(0.6, 0.10 * (o.deep || 1)))) n = 3; }
    }
    if (o.minTpl) { while (n < o.minTpl) n++; if (n >= o.minTpl && n < 3 && MH.chance(0.18 * (o.deep || 1))) n++; }
    n = Math.min(n, slots); if (!n) return;
    const pool = MH.shuffle(MH.templateStats(it).slice()), cursed = n === 1 && !o.minTpl && MH.chance(0.2);
    for (let i = 0; i < n; i++) {
      const s = pool[i], mag = MH.ri(1, 1 + Math.floor(depth / 4));
