    }
  };
  const _mi = MH.makeItem;
  MH.makeItem = function (cat, depth, opts) {
    MH._lo = opts || null;
    try { return _mi(cat, depth); } finally { MH._lo = null; }
  };

  /* ---- affichage ---- */
  const _in = MH.itemName;
  MH.itemName = function (it, v) {
    const shown = (!it.held && it.ident && it.cat !== 'gg') ? Object.assign({}, it, { held: true }) : it; // trésor identifié au sol : nom complet
    let s = _in(shown, v);
    if (shown.held && MH.isEquipCat(it.cat) && it.mithril && it.kind) s = s.replace(it.kind, it.kind + ' en mithril');
    if (shown.held && it.cat === 'composant') s += ` (${MH.QUAL[MH.compQual(it)]}, ${MH.SIZE[MH.compSize(it)]})`;
    return s;
  };

  /* ---- composants : taille (petit/moyen/gros monstre) et qualité ---- */
  MH.sizeOfSpec = spec => spec.lvl <= 3 ? 0 : spec.lvl <= 8 ? 1 : 2;
  MH.compSize = it => it.size != null ? it.size : (() => { const s = MH.MONSTERS.find(m => m.name === it.from); return s ? MH.sizeOfSpec(s) : 1; })();
  MH.compQual = it => it.qual != null ? it.qual : 2;
  const _mc = MH.makeComponent;
  MH.makeComponent = function (spec, qual) {
    const c = _mc(spec), r = MH.rnd();
    c.size = MH.sizeOfSpec(spec);
    c.qual = qual != null ? qual : (r < 0.10 ? 0 : r < 0.35 ? 1 : r < 0.65 ? 2 : r < 0.90 ? 3 : 4);
    c.price = Math.max(2, Math.round(c.price * (0.6 + 0.2 * c.qual)));
    return c;
  };
  /** composant d'une taille donnée, qualité ≥ minQ (récompenses) */
  MH.makeComponentSized = function (size, minQ) {
    const pool = MH.MONSTERS.filter(m => MH.sizeOfSpec(m) === size);
    return MH.makeComponent(MH.pick(pool), MH.ri(minQ, 4));
  };
})();

/* ---- comparaison avec l'équipement porté (objets identifiés) ---- */
MH.compareMods = function (p, it) {
  const slot = MH.SLOT_OF[it.cat]; if (!slot || !it.ident || p.equip[slot] === it) return null;
  const cur = p.equip[slot], parts = [];
  MH.TEMPLATE_KEYS = MH.TEMPLATE_KEYS || ['att', 'esq', 'deg', 'reg', 'arm', 'vue', 'pv'];

  return { parts, dw: (it.w || 0) - (cur ? cur.w || 0 : 0), empty: !cur };
};


/* ---------- Identification des trésors ----------

};
MH.floorItems = c => MH.itemsAt(c.n, c.x, c.y);

  if (!MH.inPlace(c, 'taniere')) return { ok: false, msg: 'Il faut être à la tanière.' };
  const ch = MH.chest(); if (ch.items.length >= MH.CHEST_MAX) return { ok: false, msg: 'Le coffre est plein.' };
  const i = c.inv.indexOf(it); if (i < 0) return { ok: false, msg: 'Objet introuvable.' };
  c.inv.splice(i, 1); ch.items.push(it); MH.msg('loot', `Déposé : ${MH.itemName(it)}.`); return { ok: true };
};
MH.actWithdraw = function (c, id) {
  if (!MH.inPlace(c, 'taniere')) return { ok: false, msg: 'Il faut être à la tanière.' };
  const ch = MH.chest(), it = ch.items.find(x => x.id === id); if (!it) return { ok: false, msg: 'Objet introuvable.' };
  ch.items.splice(ch.items.indexOf(it), 1); c.inv.push(it); MH.msg('loot', `Repris : ${MH.itemName(it)}.`); return { ok: true };
};
MH.actDepositGG = function (c, n) {
  if (!MH.inPlace(c, 'taniere')) return { ok: false, msg: 'Il faut être à la tanière.' };
  n = Math.min(n, c.gg); if (n <= 0) return { ok: false, msg: 'Pas de GG\' à déposer.' };
  c.gg -= n; MH.chest().gg += n; MH.msg('loot', `Tu déposes ${n} GG'.`); return { ok: true };
};
MH.actWithdrawGG = function (c, n) {
  if (!MH.inPlace(c, 'taniere')) return { ok: false, msg: 'Il faut être à la tanière.' };
  const ch = MH.chest(); n = Math.min(n, ch.gg); if (n <= 0) return { ok: false, msg: 'Le coffre est vide.' };
  ch.gg -= n; c.gg += n; MH.msg('loot', `Tu retires ${n} GG'.`); return { ok: true };
};

MH.refreshBoard = function (c) {
  const G = MH.G, day = Math.floor(G.time / 1440);
  if (G.board && G.board.day === day && G.board.lvl === c.lvl) return G.board;
  const maxD = Math.min(12, 2 + c.lvl), specs = MH.MONSTERS.filter(s => s.depth[0] <= maxD && s.lvl <= 3 + c.lvl * 2), list = [];
  MH.shuffle(specs.slice()).slice(0, 3).forEach((s, i) => {
    const count = MH.ri(3, 5) + Math.floor(c.lvl / 3);
    list.push({ id: MH.uid(), spec: s.id, name: s.name, count, gg: count * s.lvl * 4 + 10, px: Math.max(2, Math.floor(count * s.lvl / 2) + 2) });
  });
  G.board = { day, lvl: c.lvl, list };
  return G.board;
};
MH.actMissionTake = function (c, id) {
  if (!MH.inPlace(c, 'auberge')) return { ok: false, msg: 'Il faut être à l\'auberge.' };
  if (c.mission) return { ok: false, msg: 'Tu as déjà une mission en cours.' };
  const m = MH.refreshBoard(c).list.find(x => x.id === id); if (!m) return { ok: false, msg: 'Mission introuvable.' };
  c.mission = { spec: m.spec, name: m.name, count: m.count, done: 0, gg: m.gg, px: m.px };
  MH.msg('loot', `Mission acceptée : tuer ${m.count} ${m.name}. Récompense : ${m.gg} GG' et ${m.px} PX.`); return { ok: true };
};
MH.actMissionClaim = function (c) {
  if (!MH.inPlace(c, 'auberge')) return { ok: false, msg: 'Il faut être à l\'auberge.' };
  const m = c.mission; if (!m || m.done < m.count) return { ok: false, msg: 'Mission non terminée.' };
  c.gg += m.gg; c.pxPub += m.px; c.mission = null; MH.G.board = null; c.questsDone = (c.questsDone || 0) + 1;

'use strict';
/* ==========================================================================
   Sauvegarde : sérialisation complète de la partie (JSON), restauration exacte
   (graphe d'entités, RNG, compteur d'identifiants).
   ========================================================================== */
MH.SAVE_VERSION = 1;
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
MH._b64enc = function (u8) {
  let o = '';
  for (let i = 0; i < u8.length; i += 3) {
    const a = u8[i], b = u8[i + 1], c = u8[i + 2], n = (a << 16) | ((b || 0) << 8) | (c || 0);
    o += B64[n >> 18 & 63] + B64[n >> 12 & 63] + (i + 1 < u8.length ? B64[n >> 6 & 63] : '=') + (i + 2 < u8.length ? B64[n & 63] : '=');
  }
  return o;
};
MH._b64dec = function (s, len) {
  const u8 = new Uint8Array(len); let k = 0;
  for (let i = 0; i < s.length && k < len; i += 4) {
    const n = (B64.indexOf(s[i]) << 18) | (B64.indexOf(s[i + 1]) << 12) | ((s[i + 2] === '=' ? 0 : B64.indexOf(s[i + 2])) << 6) | (s[i + 3] === '=' ? 0 : B64.indexOf(s[i + 3]));
    u8[k++] = n >> 16 & 255; if (s[i + 2] !== '=' && k < len) u8[k++] = n >> 8 & 255; if (s[i + 3] !== '=' && k < len) u8[k++] = n & 255;
  }
  return u8;
};
const DROP = new Set(['lastHitBy', '_identTarget', '_conc', '_lastPlace']);

MH.serialize = function () {
  const G = MH.G;
  const all = [G.p]; G.actors.forEach(a => { if (!a.dead && a !== G.p) all.push(a); });
  G.soc.rivals.forEach(r => { if (!all.includes(r)) all.push(r); });
  const levels = {};
  Object.keys(G.levels).forEach(k => {
    const L = G.levels[k], o = {};
    Object.keys(L).forEach(key => { if (key !== 'ents' && key !== 't' && key !== 'seen' && key !== 'items') o[key] = L[key]; });
    o.t = MH._b64enc(L.t); o.seen = MH._b64enc(L.seen); o.items = Array.from(L.items.entries());
    levels[k] = o;
  });
  const g = {};
  Object.keys(G).forEach(k => { if (!['levels', 'actors', 'p', 'soc', 'log', 'fx', 'flash'].includes(k)) g[k] = G[k]; });
  g.log = G.log.slice(-120);
  const soc = Object.assign({}, G.soc, { rivals: G.soc.rivals.map(r => r.id) });
  return JSON.stringify({ v: MH.SAVE_VERSION, rng: MH._getRng(), uid: MH.getUid(), ents: all, actorIds: G.actors.filter(a => !a.dead).map(a => a.id), levels, g, soc }, (k, v) => DROP.has(k) ? undefined : v);
};

MH.deserialize = function (str) {
  const S = JSON.parse(str);
  MH.validateSave(S);
  const G = { levels: {}, actors: [], fx: [], flash: null };
  Object.assign(G, S.g);
  Object.keys(S.levels).forEach(k => {
    const o = S.levels[k], L = Object.assign({}, o), size = o.w * o.h;
    L.t = MH._b64dec(o.t, size); L.seen = MH._b64dec(o.seen, size); L.items = new Map(o.items); L.ents = new Map();
    G.levels[k] = L;
  });
  const byId = new Map(); S.ents.forEach(e => byId.set(e.id, e));
  G.p = S.ents[0];
  G.actors = S.actorIds.map(id => byId.get(id)).filter(Boolean);
  G.soc = Object.assign({}, S.soc, { rivals: S.soc.rivals.map(id => byId.get(id)).filter(Boolean) });
  MH.G = G;
  S.ents.forEach(e => { if (!e.dead) MH.placeEnt(e); });
  MH.setUid(S.uid); MH._setRng(S.rng);
  return G;
};

/* ---------- stockage local ---------- */
MH.SAVE_KEY = 'mountyhall_solo_save_v1';
MH.BAK_KEY = 'mountyhall_solo_save_v1_bak';
MH.saveGame = function () {
  try {
    if (!MH.G) return false;
    const cur = localStorage.getItem(MH.SAVE_KEY), m = cur && /"turnNo":(\d+)/.exec(cur);
    if (m && +m[1] < MH.G.turnNo) { try { localStorage.setItem(MH.BAK_KEY, cur); } catch (e) {} } // copie de secours : état du tour précédent
    localStorage.setItem(MH.SAVE_KEY, MH.serialize()); return true;
  } catch (e) { return false; }
};
MH.hasBackup = function () { try { return !!localStorage.getItem(MH.BAK_KEY); } catch (e) { return false; } };
MH.validateSave = function (S) {
  if (!S || S.v !== MH.SAVE_VERSION) throw new Error('version incompatible');
  if (!Array.isArray(S.ents) || !S.ents.length || !S.ents[0].isPlayer) throw new Error('joueur absent');
  if (!S.levels || Object.keys(S.levels).length < 2) throw new Error('niveaux absents');
  if (!S.soc || !S.g) throw new Error('données incomplètes');
  const o = S.levels[0]; if (!o || typeof o.t !== 'string' || o.t.length < o.w * o.h * 1.3) throw new Error('carte corrompue');
};
MH.hasSave = function () { try { return !!localStorage.getItem(MH.SAVE_KEY); } catch (e) { return false; } };
MH.saveInfo = function () {
  for (const k of [MH.SAVE_KEY, MH.BAK_KEY]) {
    try { const s = JSON.parse(localStorage.getItem(k)); const p = s.ents[0]; return { name: p.name, race: p.race, lvl: p.lvl, turn: s.g.turnNo }; } catch (e) { /* essaie la copie */ }
  }
  return null;
};
MH.loadGame = function (which) {
  MH.lastLoad = null;
  const tryKey = (k, tag) => { try { const s = localStorage.getItem(k); if (!s) return null; const G = MH.deserialize(s); MH.lastLoad = tag; return G; } catch (e) { console.warn('Sauvegarde ' + tag + ' illisible : ' + e.message); return null; } };
  if (which === 'bak') return tryKey(MH.BAK_KEY, 'backup');
  return tryKey(MH.SAVE_KEY, 'main') || tryKey(MH.BAK_KEY, 'backup');
};
MH.clearSave = function () { try { localStorage.removeItem(MH.SAVE_KEY); localStorage.removeItem(MH.BAK_KEY); } catch (e) {} };

MH._pad = row => (row + '................').slice(0, 16);
MH._shade = function (hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
};

/* ---------- Dessin d'un sprite ---------- */
MH._drawRows = function (ctx, rows, map) {
  for (let y = 0; y < 16; y++) {
    const row = MH._pad(rows[y] || '');
    for (let x = 0; x < 16; x++) {
      const ch = row[x], col = map[ch];
      if (col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
    }
  }
};
MH._mkCanvas = function (w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

MH.spriteFor = function (c) {
  let key, rows, map;
  const K = '#0d0a12', W = '#efe8d4';
  if (c.kind === 'troll') {
    const R = MH.RACES[c.race];
    key = 'troll:' + c.race + (c.clothes || '');
    if (MH.SPR.cache[key]) return MH.SPR.cache[key];
    const cloth = c.clothes || '#6b4a2b';
    rows = MH.SHAPES.troll;
    map = { K, B: R.skin, D: R.dark, L: MH._shade(R.skin, 0.28), E: R.eye, W, C: cloth };
    if (c.race === 'tomawak') rows = rows.map(r => r.replace(/KBBBBBBK/, 'KCCCCCCK'));
  } else {
    key = 'mon:' + c.spec;
    if (MH.SPR.cache[key]) return MH.SPR.cache[key];
    const pal = c.pal;
    rows = MH.SHAPES[c.shape] || MH.SHAPES.beast;
    map = { K, B: pal[0], D: pal[1], L: MH._shade(pal[0], 0.3), E: pal[2], W, C: pal[1], R: '#c0392b' };
  }
  const cv = MH._mkCanvas(16, 16), g = cv.getContext('2d');
  MH._drawRows(g, rows, map);
  MH.SPR.cache[key] = cv;
  return cv;
};
/** version « silhouette blanche » pour le flash de dégâts */
MH.flashFor = function (c) {
  const base = MH.spriteFor(c), key = 'flash:' + (c.kind === 'troll' ? 'troll:' + c.race : 'mon:' + c.spec);
  if (MH.SPR.cache[key]) return MH.SPR.cache[key];
  const cv = MH._mkCanvas(16, 16), g = cv.getContext('2d');
  g.drawImage(base, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#ffffff'; g.fillRect(0, 0, 16, 16);
  MH.SPR.cache[key] = cv; return cv;
};

MH.ICON_COLORS = {

  scroll: { K: '#0d0a12', W: '#e8dcb4' },

MH.iconFor = function (name, tint) {
  const key = 'icon:' + name + (tint || '');
  if (MH.SPR.cache[key]) return MH.SPR.cache[key];
  const cv = MH._mkCanvas(16, 16), g = cv.getContext('2d');
  const map = Object.assign({}, MH.ICON_COLORS[name] || MH.ICON_COLORS.bag);

  else if (tint) { map.B = tint; map.L = MH._shade(tint, 0.35); map.D = MH._shade(tint, -0.4); }

/* ---------- Tuiles ---------- */
MH.BIOMES = [
  { rockTop: '#100e16', rockFace: '#2a2636', rockMortar: '#1a1724', floor: '#2f2b3d', floorLo: '#272433', floorHi: '#3a3650', moss: '#3a5a3a', accent: '#6a7ab8' },
  { rockTop: '#130f1a', rockFace: '#2e2440', rockMortar: '#1c1530', floor: '#352b45', floorLo: '#2b2339', floorHi: '#44385a', moss: '#4a4a7a', accent: '#a07ae0' },
  { rockTop: '#1a0f10', rockFace: '#3a2224', rockMortar: '#241314', floor: '#40292b', floorLo: '#331f21', floorHi: '#52363a', moss: '#6a4a2a', accent: '#e07a4a' },
  { rockTop: '#0c1514', rockFace: '#1f3634', rockMortar: '#142423', floor: '#243a39', floorLo: '#1c2e2d', floorHi: '#30504d', moss: '#3a7a5a', accent: '#5ae0b0' }
];
MH.biomeOf = n => MH.BIOMES[Math.min(3, Math.floor((Math.abs(n) - 1) / 3))];
MH._hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

MH._tile = function (key, fn) {
  if (MH.SPR.tiles[key]) return MH.SPR.tiles[key];
  const cv = MH._mkCanvas(16, 16), g = cv.getContext('2d');
  fn(g); MH.SPR.tiles[key] = cv; return cv;
};
MH._noise = function (g, base, lo, hi, seed, dens) {
  g.fillStyle = base; g.fillRect(0, 0, 16, 16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    const h = MH._hash(x, y, seed);
    if (h < dens) { g.fillStyle = lo; g.fillRect(x, y, 1, 1); } else if (h > 1 - dens) { g.fillStyle = hi; g.fillRect(x, y, 1, 1); }
  }
};

/** Renvoie le canvas de tuile pour (type, variante, biome, face?) */
MH.tileCanvas = function (type, v, n, face) {
  const T = MH.T, B = MH.biomeOf(n || 1), bi = Math.min(3, Math.floor((Math.abs(n || 1) - 1) / 3));
  v = v & 3;
  switch (type) {
    case T.ROCK:
      if (face) return MH._tile(`rf${bi}${v}`, g => {
        MH._noise(g, B.rockFace, B.rockMortar, MH._shade(B.rockFace, 0.18), 11 + v, 0.12);
        g.fillStyle = B.rockMortar; g.fillRect(0, 5, 16, 1); g.fillRect(0, 11, 16, 1);
        g.fillRect((v * 5 + 3) % 16, 0, 1, 5); g.fillRect((v * 7 + 9) % 16, 6, 1, 5); g.fillRect((v * 3 + 5) % 16, 12, 1, 4);
        g.fillStyle = MH._shade(B.rockFace, 0.22); g.fillRect(0, 0, 16, 1);
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 13, 16, 3);
      });
      return MH._tile(`rt${bi}${v}`, g => { MH._noise(g, B.rockTop, MH._shade(B.rockTop, -0.35), MH._shade(B.rockTop, 0.35), 21 + v, 0.1); });
    case T.FLOOR: case T.SHAFT: case T.BONES: case T.MOSS:
      return MH._tile(`f${bi}${v}${type}`, g => {
        MH._noise(g, B.floor, B.floorLo, B.floorHi, 31 + v, 0.1);
        // pavés / cailloux
        g.fillStyle = B.floorLo;
        for (let i = 0; i < 3; i++) { const x = Math.floor(MH._hash(i, v, 5) * 13), y = Math.floor(MH._hash(i, v, 9) * 13); g.fillRect(x, y, 2, 2); }
        if (type === T.MOSS) { g.fillStyle = B.moss; for (let i = 0; i < 26; i++) { const x = Math.floor(MH._hash(i, v, 41) * 16), y = Math.floor(MH._hash(i, v, 43) * 16); g.fillRect(x, y, 1 + (i % 2), 1); } }
        if (type === T.BONES) {
          g.fillStyle = '#d8d2bd'; g.fillRect(4, 8, 6, 1); g.fillRect(3, 7, 2, 1); g.fillRect(3, 9, 2, 1); g.fillRect(9, 7, 2, 1); g.fillRect(9, 9, 2, 1);
          g.fillStyle = '#d8d2bd'; g.fillRect(10, 3, 3, 3); g.fillStyle = '#100e16'; g.fillRect(10, 4, 1, 1); g.fillRect(12, 4, 1, 1);
        }
        if (type === T.SHAFT) {
          g.fillStyle = '#07050b'; g.fillRect(2, 2, 12, 12); g.fillStyle = '#16111f'; g.fillRect(3, 3, 10, 10);
          g.fillStyle = '#a78a55'; g.fillRect(4, 3, 1, 10); g.fillRect(11, 3, 1, 10);
          for (let y = 4; y < 13; y += 3) g.fillRect(4, y, 8, 1);
          g.fillStyle = B.accent; g.fillRect(1, 1, 14, 1); g.fillRect(1, 14, 14, 1); g.fillRect(1, 1, 1, 14); g.fillRect(14, 1, 1, 14);
        }
      });
    case T.GRASS:
      return MH._tile(`g${v}`, g => {
        MH._noise(g, '#355f31', '#2c4f29', '#44763c', 51 + v, 0.12);
        g.fillStyle = '#5a9a4a';
        for (let i = 0; i < 4; i++) { const x = Math.floor(MH._hash(i, v, 61) * 14) + 1, y = Math.floor(MH._hash(i, v, 63) * 12) + 2; g.fillRect(x, y, 1, 2); }
        if (v === 2) { g.fillStyle = '#e8d870'; g.fillRect(5, 6, 1, 1); g.fillStyle = '#f0f0f0'; g.fillRect(11, 10, 1, 1); }
      });
    case T.PATH:
      return MH._tile(`p${v}`, g => {
        MH._noise(g, '#7d6a4c', '#6a5a40', '#9a8663', 71 + v, 0.14);
        g.fillStyle = '#5d4e37'; for (let i = 0; i < 3; i++) { g.fillRect(Math.floor(MH._hash(i, v, 73) * 13), Math.floor(MH._hash(i, v, 79) * 13), 3, 2); }
      });
    case T.TREE:
      return MH._tile(`t${v}`, g => {
        MH._noise(g, '#2c4f29', '#244422', '#355f31', 81, 0.1);
        g.fillStyle = '#4b3220'; g.fillRect(7, 11, 2, 4);
        g.fillStyle = '#1d4020'; g.beginPath(); g.arc(8, 7, 7, 0, 6.3); g.fill();
        g.fillStyle = '#2b6b2a'; g.beginPath(); g.arc(7, 6, 5, 0, 6.3); g.fill();
        g.fillStyle = '#4a9a3c'; g.fillRect(5, 4, 3, 2); g.fillRect(9, 7, 2, 2);
        g.fillStyle = '#163516'; g.fillRect(3, 10, 3, 1);
      });
    case T.WALL:
      return MH._tile(`w${v}`, g => {
        g.fillStyle = '#6b2f2f'; g.fillRect(0, 0, 16, 16);
        for (let r = 0; r < 4; r++) { g.fillStyle = r % 2 ? '#7d3b36' : '#5a2626'; g.fillRect(0, r * 4, 16, 3); g.fillStyle = '#3d1a1a'; g.fillRect(0, r * 4 + 3, 16, 1); }
        g.fillStyle = '#3d1a1a'; for (let r = 0; r < 4; r++) g.fillRect((r % 2 ? 4 : 10) + v, r * 4, 1, 3);
      });
    case T.FLOORB:
      return MH._tile(`fb${v}`, g => {
        g.fillStyle = '#6b4a2b'; g.fillRect(0, 0, 16, 16);
        for (let r = 0; r < 4; r++) { g.fillStyle = r % 2 ? '#7a5733' : '#5f4126'; g.fillRect(0, r * 4, 16, 3); g.fillStyle = '#3d2814'; g.fillRect(0, r * 4 + 3, 16, 1); }
        g.fillStyle = '#3d2814'; g.fillRect((v * 5 + 4) % 14, 0, 1, 3);
      });
    case T.DOOR:
      return MH._tile('door', g => {
        g.fillStyle = '#6b4a2b'; g.fillRect(0, 0, 16, 16);
        g.fillStyle = '#2a1a0c'; g.fillRect(2, 0, 12, 16); g.fillStyle = '#4b3118'; g.fillRect(3, 1, 10, 15);
        g.fillStyle = '#d9a441'; g.fillRect(10, 8, 2, 2);
        g.fillStyle = '#e9c27a'; g.fillRect(2, 0, 12, 1);
      });
    case T.WATER:
      return MH._tile(`wa${v}`, g => {
        MH._noise(g, '#24466e', '#1d3a5c', '#33608f', 91 + v, 0.1);
        g.fillStyle = '#5b8fc0'; g.fillRect(2 + v, 5, 4, 1); g.fillRect(9, 10 - v, 4, 1);
      });
  }
  return MH._tile('unk', g => { g.fillStyle = '#f0f'; g.fillRect(0, 0, 16, 16); });
};

/* ===== 45_sites.js ===== */
'use strict';
/* ==========================================================================
   Lieux remarquables (cryptes, mines, sanctuaires), bestiaire, journal d'aventure [EXTRA]
   ========================================================================== */
MH.BOSS_NAMES = ['Zorgul le Fossoyeur', 'Mortebrume', 'Ossegrince', 'Dame Vermine', 'Cadavrus', 'Le Roi Moisi', 'Grimpelune', 'Tombegueule'];
MH.SITE_NAMES = { crypte: n => `Crypte de ${n}`, mine: null, sanctuaire: null };
MH.MINE_NAMES = ['Mine des Oubliés', 'Filon de Grobak', 'Galerie Éboulée', 'Carrière des Gueux', 'Puits du Nain Perdu'];
MH.SANCT_NAMES = ['Autel de Mouch', 'Sanctuaire des Mousses', 'Chapelle de Gluk', 'Niche du Vieux Troll'];
MH.SITE_ICON = { crypte: '☠', mine: '⛏', sanctuaire: '✚' };

MH.bestiary = () => (MH.G.bestiary = MH.G.bestiary || {});
MH.journalList = () => (MH.G.journal = MH.G.journal || []);
MH.journal = function (txt) { const J = MH.journalList(); J.unshift({ t: MH.G.time, turn: MH.G.turnNo, txt }); if (J.length > 200) J.length = 200; };

MH._siteSpot = function (L, taken) {
  for (let tries = 0; tries < 300; tries++) {
    const i = L.main[Math.floor(MH.rnd() * L.main.length)], x = i % L.w, y = (i / L.w) | 0;
    if (L.t[i] === MH.T.SHAFT) continue;
    if (L.shafts && L.shafts.some(s => MH.cheb(s.x, s.y, x, y) < 10)) continue;
    if (taken.some(s => MH.cheb(s.x, s.y, x, y) < 14)) continue;
    let free = 0; for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (MH.isWalk(L, x + dx, y + dy)) free++;
    if (free >= 30) return { x, y };
  }
  return null;
};
MH.initSites = function (G) {
  const names = MH.shuffle(MH.BOSS_NAMES.slice()), mines = MH.shuffle(MH.MINE_NAMES.slice()), sancts = MH.shuffle(MH.SANCT_NAMES.slice());
  G.nextSite = 1;
  for (let n = 2; n <= MH.LEVELS_MAX; n++) {
    const L = G.levels[n]; L.sites = [];
    const count = n >= 5 ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const spot = MH._siteSpot(L, L.sites); if (!spot) continue;
      const r = MH.rnd(), type = r < 0.4 ? 'crypte' : r < 0.75 ? 'mine' : 'sanctuaire';
      const site = { id: G.nextSite++, type, n, x: spot.x, y: spot.y, r: 3, found: false, cleared: false, prayed: -1 };
      if (type === 'crypte') { const b = names.pop() || 'Le Sans-Nom'; site.name = MH.SITE_NAMES.crypte(b); site.boss = b; MH._buildCrypt(G, L, site); }
      else if (type === 'mine') { site.name = mines.pop() || 'Vieille Mine'; MH._buildMine(G, L, site); }
      else { site.name = sancts.pop() || 'Autel Anonyme'; }
      L.sites.push(site);
    }
  }
};
MH._addMon = function (spec, n, x, y, gid, site, tactic) {
  const m = MH.newMonster(spec, n, x, y, gid); m.home = { x: site.x, y: site.y }; m.dla = MH.ri(1, spec.dur); m.siteId = site.id;
  if (tactic) m.tactic = tactic; MH.G.actors.push(m); MH.placeEnt(m); return m;
};
MH._buildCrypt = function (G, L, site) {
  const n = site.n, pool = MH.eligibleSpecs(n).filter(s => s.shape === 'undead' || s.shape === 'ghost' || s.shape === 'caped');
  const spec = pool.length ? MH.pick(pool) : MH.pick(MH.eligibleSpecs(n));
  const b = MH._addMon(spec, n, site.x, site.y, 0, site, 'guard');
  b.name = `${site.boss} (${spec.name})`; b.lvl = spec.lvl + 3; b.hpMax = b.hp = Math.round(spec.pv * 1.8); b.att++; b.deg++; b.arm++; b.noflee = true; b.boss = true; b.beh = 'aggro';
  const gid = MH.uid(), free = MH._freeAround(L, site.x, site.y, 3); MH.shuffle(free);
  for (let k = 0; k < 2 && k < free.length; k++) MH._addMon(spec, n, free[k][0], free[k][1], gid, site, 'guard');
  for (let k = 0; k < 4 && k < free.length - 2; k++) { const f = free[k + 2]; MH.dropItem(n, f[0], f[1], MH.chance(0.5) ? { id: MH.uid(), cat: 'gg', amount: MH.ri(n * 2, n * 6), w: 0 } : MH.makeItem(MH.pick(['potion', 'parchemin', 'talisman']), n + 1)); }
};
MH._buildMine = function (G, L, site) {
  const n = site.n, free = MH._freeAround(L, site.x, site.y, 3); MH.shuffle(free);
  let k = 0;
  for (; k < 3 && k < free.length; k++) MH.dropItem(n, free[k][0], free[k][1], { id: MH.uid(), cat: 'gg', amount: MH.ri(n * 4, n * 10), w: 0 });
  for (; k < 9 && k < free.length; k++) MH.dropItem(n, free[k][0], free[k][1], MH.makeItem(MH.pick(['arme', 'armure', 'casque', 'bottes', 'talisman', 'potion']), n + 2));
  const specs = MH.eligibleSpecs(n), gid = MH.uid();
  const spec = MH.pick(specs.filter(s => MH.TACTIC[s.id] === 'guard').concat(specs.slice(0, 3)));
  for (let j = 0; j < 3 && j < free.length; j++) MH._addMon(spec, n, free[free.length - 1 - j][0], free[free.length - 1 - j][1], gid, site, 'guard');
};
MH.siteAt = function (n, x, y, r) { const L = MH.G.levels[n]; return (L && L.sites || []).find(s => MH.cheb(s.x, s.y, x, y) <= (r === undefined ? s.r : r)); };

/* --- sanctuaire --- */
MH.prayCost = c => 15 * c.lvl;
MH.actPray = function (p) {
  const s = p.n > 0 && MH.siteAt(p.n, p.x, p.y, 1);
  if (!s || s.type !== 'sanctuaire') return { ok: false, msg: 'Aucun autel ici.' };
  const day = Math.floor(MH.G.time / 1440);
  if (s.prayed === day) return { ok: false, msg: 'Les puissances ont déjà reçu ton offrande aujourd\'hui.' };
  if (p.pa < 1) return { ok: false, msg: 'Prier coûte 1 PA.' };
  const cost = MH.prayCost(p); if (p.gg < cost) return { ok: false, msg: `Il faut une offrande de ${cost} GG'.` };
  MH.spendPA(p, 1); p.gg -= cost; s.prayed = day; p.hp = MH.hpMaxOf(p);
  MH.addBuff(p, 'att', 1, 5, 'Bénédiction'); MH.addBuff(p, 'esq', 1, 5, 'Bénédiction');
  MH.msg('lvl', `Tu déposes ${cost} GG' sur l'autel : tes blessures se referment et une chaleur étrange te porte (+1 ATT/ESQ, 5 tours).`);
  MH.journal(`Prière à ${s.name} (N-${s.n}).`);
  return { ok: true };
};

/* --- découverte, bestiaire, record, mort --- */
const _revealSite = MH.revealAround;
MH.revealAround = function (c) {
  _revealSite(c);
  if (!c.isPlayer || !MH.G) return;
  const G = MH.G, L = G.levels[c.n], r = MH.vueOf(c);
  if (c.n > (G.stats.maxDepth || 0)) { G.stats.maxDepth = c.n; if (c.n > 0) MH.journal(`Profondeur record : N-${c.n}.`); }
  (L.sites || []).forEach(s => { if (!s.found && MH.cheb(c.x, c.y, s.x, s.y) <= r + 1) { s.found = true; MH.msg('lvl', `✦ Lieu découvert : ${s.name} (${s.type}).`); MH.journal(`Découverte : ${s.name} (N-${s.n}).`); } });
  const B = MH.bestiary();
  for (let y = c.y - r; y <= c.y + r; y++) for (let x = c.x - r; x <= c.x + r; x++) MH.entsAt(c.n, x, y).forEach(o => {
    if (o.kind === 'monster' && MH.canSee(c, o)) { const e = B[o.spec] = B[o.spec] || { seen: 0, kills: 0 }; if (!e.seen) { e.seen = G.turnNo; if (G.turnNo > 1) MH.msg('sys', `Bestiaire : première rencontre avec ${MH.MON[o.spec].name}.`); } }
  });
};
const _omdSite = MH.onMonsterDeath;
MH.onMonsterDeath = function (m, killer) {
  if (_omdSite) _omdSite(m, killer);
  const G = MH.G;
  if (killer === G.p) {
    const e = MH.bestiary()[m.spec] = MH.bestiary()[m.spec] || { seen: G.turnNo, kills: 0 }; e.kills++;
    if (!G.stats.bestKill || m.lvl > G.stats.bestKill.lvl) { G.stats.bestKill = { name: m.name, lvl: m.lvl }; if (m.lvl >= 5) MH.journal(`Plus grand exploit : ${m.name} (niv.${m.lvl}) terrassé.`); }
  }
  if (m.boss) {
    const s = (G.levels[m.n].sites || []).find(x => x.id === m.siteId);
    if (s) s.cleared = true;

'use strict';
/* ==========================================================================
   Événements du monde, créatures rares, marchand itinérant, rivaux chasseurs
   de boss, trousse de départ [EXTRA]
   ========================================================================== */
MH.rollWorldEvent = function () {
  const G = MH.G, day = Math.floor(G.time / 1440);
  if (G.eventDay === day) return null; G.eventDay = day;
  G.events = (G.events || []).filter(e => e.until >= day);
  if (day === 0 || !MH.chance(0.5)) return null;
  const r = MH.rnd(), p = G.p, hi = Math.min(12, 2 + p.lvl);
  let ev = null;
  if (r < 0.4) { // migration
    const n = MH.ri(1, hi), specs = MH.eligibleSpecs(n); if (!specs.length) return null;
    const spec = MH.pick(specs), L = G.levels[n]; let c = 0;
    for (let i = 0; i < 2; i++) c += MH.spawnColony(L, true, spec) || 0;
    ev = { type: 'migration', n, spec: spec.id, until: day + 3, txt: `Migration : des ${spec.name} déferlent sur le niveau N-${n} (${c} créatures).` };
  } else if (r < 0.75) { // créature rare
    const n = MH.ri(2, Math.max(2, hi)), specs = MH.eligibleSpecs(n).filter(s => s.group[1] === 1 || s.lvl >= 5); if (!specs.length) return null;
    const spec = MH.pick(specs), L = G.levels[n];
    for (let t = 0; t < 40; t++) {
      const i = L.main[Math.floor(MH.rnd() * L.main.length)], x = i % L.w, y = (i / L.w) | 0;
      if (L.t[i] === MH.T.SHAFT || (p.n === n && MH.cheb(p.x, p.y, x, y) <= MH.vueOf(p) + 5)) continue;
      const m = MH.spawnMonster(spec, n, x, y, 0, false); m.home = { x, y }; m.rare = true;
      m.name = `${spec.name} Alpha`; m.lvl = spec.lvl + 2; m.hpMax = m.hp = Math.round(spec.pv * 1.6); m.att++; m.noflee = true;
      ev = { type: 'rare', n, spec: spec.id, until: day + 5, txt: `Rumeur : ${m.name} rôde au niveau N-${n}. On dit que la bête garde un trésor.` }; break;
    }
  } else { // marchand itinérant
    ev = { type: 'marchand', until: day + 2, txt: 'Un marchand itinérant a installé son étal à l\'échoppe de Gnak pour deux jours : objets rares.' };
  }
  if (ev) { G.events.push(ev); MH.news(ev.txt); MH.msg('lvl', `✦ ${ev.txt}`); MH.journal(ev.txt); }
  return ev;
};
MH.merchantActive = () => (MH.G.events || []).some(e => e.type === 'marchand' && e.until >= Math.floor(MH.G.time / 1440));
const _rsEv = MH.refreshShop;

  const sh = _rsEv(), G = MH.G;
  if (MH.merchantActive() && !sh.merchant) {
    sh.merchant = true;
    for (let i = 0; i < 4; i++) { const it = MH.makeItem(MH.pick(['arme', 'armure', 'casque', 'bottes', 'talisman']), 7 + i); it.ident = true; it.rare = true; sh.stock.push(it); }

MH.societyTick = function () {
  if (_stEv) _stEv();
  const G = MH.G, p = G.p; if (!G.soc) return;
  MH.rollWorldEvent();
  // les rivaux costauds purifient parfois une crypte (hors de la vue du joueur)
  if (MH.chance(0.1)) {
    const cand = G.soc.rivals.filter(r => r.n >= 2 && r.n !== p.n && r.hp > MH.hpMaxOf(r) * 0.6 && r.mood !== 'pacifique');
    for (const r of MH.shuffle(cand.slice())) {
      const s = ((G.levels[r.n] || {}).sites || []).find(x => x.type === 'crypte' && !x.cleared); if (!s) continue;
      const b = G.actors.find(a => a.boss && a.siteId === s.id && !a.dead); if (!b) continue;
      const pw = Math.max(0.1, Math.min(0.85, 0.5 + 0.12 * (r.lvl - b.lvl)));
      if (MH.chance(pw)) {
        b.hp = 0; b.dead = true; MH.unplaceEnt(b); G.actors.splice(G.actors.indexOf(b), 1); s.cleared = true;
        r.pxPub += MH.killPX(r.lvl, b.lvl); r.kills++; r.gg += 30 * s.n; r.hp = Math.max(1, r.hp - Math.round(MH.hpMaxOf(r) * 0.4));

'use strict';
/* ==========================================================================
   Troc avec les trolls PNJ [EXTRA]
   - Les rivaux ramassent de vrais trésors du Hall (au sol, sur leur niveau) :

   - Chaque jour ils mettent en vente une partie seulement de ce sac (leur étal).

  MH.relTier = t => { const r = MH.relOf(t); let name = MH.REL_TIERS[0][1]; MH.REL_TIERS.forEach(([k, n]) => { if (r >= k) name = n; }); return name; };

      const full = c.hp >= MH.hpMaxOf(c); c.equip[slot] = it; MH.recalc(c); if (full) c.hp = MH.hpMaxOf(c);
    } else c.inv.push(it);
    // sac borné : on se débarrasse de ce qui vaut le moins par poids
    while (c.inv.length > 8 || c.inv.reduce((s, i) => s + (i.w || 0), 0) > 50) {
      const worst = c.inv.reduce((a, b) => ((a.price || 1) / Math.max(1, a.w || 1)) <= ((b.price || 1) / Math.max(1, b.w || 1)) ? a : b);
      c.inv.splice(c.inv.indexOf(worst), 1);

    const keys = []; L.items.forEach((arr, k) => { if (arr.some(i => i.cat !== 'gg' && i.cat !== 'relique' && !i.quest)) keys.push(k); });
    if (!keys.length) return false;

      if (s.x < -TS * 8 || s.x > R.W + TS * 8 || s.y < -TS * 8 || s.y > R.H + TS * 8) return;
      const col = si.type === 'crypte' ? '160,90,200' : si.type === 'mine' ? '220,170,60' : '90,200,150';
      ctx.fillStyle = `rgba(${col},0.10)`; ctx.beginPath(); ctx.arc(s.x + TS / 2, s.y + TS / 2, TS * (si.r + 0.5), 0, 6.3); ctx.fill();
      ctx.strokeStyle = `rgba(${col},0.35)`; ctx.lineWidth = 1; ctx.stroke();
      ctx.font = 'bold 10px "Courier New", monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = '#000'; ctx.fillText(si.name, s.x + TS / 2 + 1, s.y - TS * si.r + 1); ctx.fillStyle = `rgb(${col})`; ctx.fillText(si.name, s.x + TS / 2, s.y - TS * si.r); ctx.textAlign = 'left';
    });
  }

  /* --- traces de sang laissées par les monstres en fuite --- */
  { const bl = MH.G.blood && MH.G.blood[L.n]; if (bl) bl.forEach(b => {
      if (b.x < x0 || b.x > x1 || b.y < y0 || b.y > y1 || !L.seen[b.y * L.w + b.x]) return;
      const age = (MH.G.time - b.t) / 2880; if (age >= 1) return;
      const s = R.tileToScreen(b.x, b.y); ctx.fillStyle = `rgba(140,18,18,${0.55 * (1 - age)})`;
      ctx.beginPath(); ctx.ellipse(s.x + 16 + ((b.x * 7 + b.y * 3) % 5) - 2, s.y + 20 + ((b.x * 3 + b.y * 5) % 5) - 2, 5, 3, 0.4, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.arc(s.x + 10 + ((b.y * 5) % 7), s.y + 14, 1.6, 0, 6.3); ctx.fill(); }); }
  /* --- objets au sol (dans la vue) --- */
  const inView = (x, y) => !dim || MH.cheb(p.x, p.y, x, y) <= vue;
  L.items.forEach((arr, k) => {
    const wx = k % L.w, wy = (k / L.w) | 0;
    if (wx < x0 || wx > x1 || wy < y0 || wy > y1 || !inView(wx, wy) || !arr.length) return;
    const s = R.tileToScreen(wx, wy), it = arr[arr.length - 1];
    const bob = Math.sin(R.t * 3 + wx * 1.3 + wy) * 1.2;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(s.x + TS / 2, s.y + TS - 7, 9, 3, 0, 0, 6.3); ctx.fill();
    ctx.drawImage(MH.itemIcon(it), s.x + 4, s.y + 3 + bob, 24, 24);
    if (arr.length > 1) { ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 10px monospace'; ctx.fillText('×' + arr.length, s.x + 18, s.y + 30); }
    const rar = MH.rarityOf ? arr.reduce((m, o) => Math.max(m, o.cat === 'gg' ? 0 : MH.rarityOf(o)), 0) : 0;
    if (rar > 0) { // les objets puissants scintillent
      const tw = (Math.sin(R.t * 5 + wx * 2.1 + wy * 1.7) + 1) / 2, col = MH.RARITY_COL[rar];
      ctx.globalAlpha = 0.25 + 0.55 * tw; ctx.fillStyle = col;
      const cx = s.x + 6 + ((wx * 7 + wy * 3) % 3) * 8, cy = s.y + 4 + ((wx * 5 + wy * 11) % 3) * 6;
      ctx.fillRect(cx - 1, cy, 3, 1); ctx.fillRect(cx, cy - 1, 1, 3); ctx.globalAlpha = 0.12 + 0.12 * tw; ctx.beginPath(); ctx.arc(s.x + TS / 2, s.y + TS / 2, 15, 0, 6.3); ctx.fill(); ctx.globalAlpha = 1;
    }
  });

  /* --- entités --- */
  const ents = MH.visibleEnts(); ents.push(p);
  const byCell = new Map();
  ents.forEach(e => { if (e !== p) MH.R._smooth(e, dt); const k = e.y * L.w + e.x; (byCell.get(k) || byCell.set(k, []).get(k)).push(e); });
  const drawList = [];
  byCell.forEach(arr => {
    arr.sort((a, b) => (b.isPlayer ? 1 : 0) - (a.isPlayer ? 1 : 0) || a.id - b.id);
    arr.forEach((e, i) => drawList.push({ e, i, n: arr.length }));
  });
  drawList.sort((a, b) => a.e.ry - b.e.ry);
  drawList.forEach(({ e, i, n }) => {
    const s = R.tileToScreen(e.rx, e.ry);
    const bob = Math.round(Math.sin(R.t * 4 + e.id) * 0.5 + 0.5);
    let sz, ox, oy;
    if (n === 1) { sz = 32; ox = 0; oy = -2 - bob; }
    else { sz = 16; ox = (i % 2) * 16; oy = Math.floor(i / 2) * 16 - bob * 0; if (i >= 4) return; }
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(s.x + ox + sz / 2, s.y + oy + sz - 2 + (n === 1 ? 2 : 0), sz * 0.32, sz * 0.1, 0, 0, 6.3); ctx.fill();
    if (e.isPlayer) {
      const pulse = 0.5 + 0.5 * Math.sin(R.t * 4);
      ctx.strokeStyle = `rgba(255,200,90,${0.45 + pulse * 0.4})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(s.x + ox + sz / 2, s.y + oy + sz - 2 + (n === 1 ? 2 : 0), sz * 0.45, sz * 0.15, 0, 0, 6.3); ctx.stroke();
    }
    const spr = (e.flash > 0) ? MH.flashFor(e) : MH.spriteFor(e);
    if (e.flash > 0) e.flash -= dt;
    ctx.save();
    if (e.state.camo || e.state.invis) ctx.globalAlpha = 0.5;
    if (e.face === -1) { ctx.translate(s.x + ox + sz, s.y + oy); ctx.scale(-1, 1); ctx.drawImage(spr, 0, 0, sz, sz); }
    else ctx.drawImage(spr, s.x + ox, s.y + oy, sz, sz);
    ctx.restore();
    // barre de vie des blessés
    const hmax = MH.hpMaxOf(e);
    if (e.hp < hmax || e === R.target) {
      const f = Math.max(0, e.hp / hmax), bw = sz - 4;
      ctx.fillStyle = '#000'; ctx.fillRect(s.x + ox + 2, s.y + oy - 1, bw, 3);
      ctx.fillStyle = f > 0.5 ? '#5fd35f' : f > 0.25 ? '#e0b030' : '#e04040'; ctx.fillRect(s.x + ox + 2, s.y + oy - 1, Math.max(1, Math.round(bw * f)), 2);
    }
    if (e.kind === 'troll' && !e.isPlayer && n === 1) { ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillText(e.name, s.x + 17, s.y + oy - 2); ctx.fillStyle = MH.hostile(MH.G.p, e) ? '#ff9a7a' : '#9fd6ff'; ctx.fillText(e.name, s.x + 16, s.y + oy - 3); ctx.textAlign = 'start'; }
    if (e.escort && !e.dead) { ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText('⚑ ' + e.name, s.x + 17, s.y + oy - 2); ctx.fillStyle = '#ffdc78'; ctx.fillText('⚑ ' + e.name, s.x + 16, s.y + oy - 3); ctx.textAlign = 'start'; }
    if (e.boss && !e.dead) { ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillText('♛ ' + e.name, s.x + 17, s.y + oy - 2); ctx.fillStyle = '#ff5a4a'; ctx.fillText('♛ ' + e.name, s.x + 16, s.y + oy - 3); ctx.textAlign = 'start'; }
    if (n > 4 && i === 3) { ctx.fillStyle = '#ffd24a'; ctx.font = 'bold 10px monospace'; ctx.fillText('+' + (n - 4), s.x + 20, s.y + 30); }
  });

  /* --- éclairage / brouillard --- */
  for (let wy = y0; wy <= y1; wy++) for (let wx = x0; wx <= x1; wx++) {
    if (!MH.inb(L, wx, wy)) continue;
    const i = wy * L.w + wx, s = R.tileToScreen(wx, wy);
    if (dim) {
      if (!L.seen[i]) continue;
      const d = MH.cheb(p.x, p.y, wx, wy);
      if (d > vue) { ctx.fillStyle = 'rgba(5,6,18,0.66)'; ctx.fillRect(s.x, s.y, TS, TS); }
      else if (d >= vue) { ctx.fillStyle = 'rgba(5,6,18,0.18)'; ctx.fillRect(s.x, s.y, TS, TS); }
    }
  }
  // lueur de torche
  if (dim) {
    const cx = W / 2, cy = H / 2, rad = (vue + 0.8) * TS * (1 + Math.sin(R.t * 7) * 0.01);
    const gr = ctx.createRadialGradient(cx, cy, 6, cx, cy, rad);
    gr.addColorStop(0, `rgba(255,190,100,${0.15 + 0.03 * Math.sin(R.t * 9) * Math.sin(R.t * 3.7)})`); gr.addColorStop(0.6, 'rgba(255,170,80,0.05)'); gr.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  } else {
    const hr = ((G.time % 1440) / 60);
    let a = 0;
    if (hr >= 21 || hr < 5) a = 0.5; else if (hr >= 18) a = (hr - 18) / 3 * 0.5; else if (hr < 7) a = (7 - hr) / 2 * 0.5;
    if (a > 0) { ctx.fillStyle = `rgba(8,12,48,${a.toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
  }

  /* --- surbrillances : cases adjacentes, survol, cible --- */
  if (R.hover && MH.inb(L, R.hover.x, R.hover.y)) {
    const s = R.tileToScreen(R.hover.x, R.hover.y), adj = MH.cheb(p.x, p.y, R.hover.x, R.hover.y) === 1;
    ctx.strokeStyle = adj ? 'rgba(255,210,100,0.9)' : 'rgba(180,180,200,0.35)'; ctx.lineWidth = 2;
    ctx.strokeRect(s.x + 1, s.y + 1, TS - 2, TS - 2);
    if (adj && MH.isWalk(L, R.hover.x, R.hover.y) && R.hoverCost) {
      ctx.fillStyle = '#000'; ctx.font = 'bold 11px monospace'; ctx.fillText(R.hoverCost, s.x + 3, s.y + 12);
      ctx.fillStyle = '#ffd24a'; ctx.fillText(R.hoverCost, s.x + 2, s.y + 11);
    }
  }
  if (R.target && !R.target.dead && R.target.n === p.n) {
    const s = R.tileToScreen(R.target.x, R.target.y), a = 0.6 + 0.4 * Math.sin(R.t * 8), c = 5;
    ctx.strokeStyle = `rgba(255,70,70,${a})`; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + c); ctx.lineTo(s.x, s.y); ctx.lineTo(s.x + c, s.y);
    ctx.moveTo(s.x + TS - c, s.y); ctx.lineTo(s.x + TS, s.y); ctx.lineTo(s.x + TS, s.y + c);
    ctx.moveTo(s.x + TS, s.y + TS - c); ctx.lineTo(s.x + TS, s.y + TS); ctx.lineTo(s.x + TS - c, s.y + TS);
    ctx.moveTo(s.x + c, s.y + TS); ctx.lineTo(s.x, s.y + TS); ctx.lineTo(s.x, s.y + TS - c);
    ctx.stroke();
  }

  /* --- textes flottants --- */
  for (let k = G.fx.length - 1; k >= 0; k--) {
    const f = G.fx[k]; f.age += dt;
    if (f.age > 1.15) { G.fx.splice(k, 1); continue; }
    const s = R.tileToScreen(f.x, f.y), a = 1 - f.age / 1.15;
    ctx.globalAlpha = Math.max(0, a);
    ctx.font = (f.big ? 'bold 18px' : 'bold 13px') + ' "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = '#000'; ctx.fillText(f.text, s.x + TS / 2 + 1, s.y + 4 - f.age * 26 + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, s.x + TS / 2, s.y + 4 - f.age * 26);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  ctx.restore();

  /* --- poussières / braises flottantes (ambiance) --- */
  if (dim) {
    R.motes = R.motes || Array.from({ length: 26 }, (_, i) => ({ x: Math.random() * W, y: Math.random() * H, v: 4 + Math.random() * 10, ph: Math.random() * 6.3, s: 1 + (i % 3 === 0 ? 1 : 0) }));
    const deep = p.n >= 7, col = deep ? '255,120,70' : '210,200,255';
    R.motes.forEach(m => {
      m.y -= m.v * dt * (deep ? 1.6 : 0.6); m.x += Math.sin(R.t * 0.8 + m.ph) * 6 * dt; if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
      ctx.fillStyle = `rgba(${col},${0.10 + 0.14 * (0.5 + 0.5 * Math.sin(R.t * 2 + m.ph))})`; ctx.fillRect(m.x, m.y, m.s, m.s);
    });
  }

  /* --- vignette --- */
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  R.tmpCount = (R.tmpCount + 1) % 6;
  if (R.tmpCount === 0) MH.R.drawMini();
};

/** Icône d'un objet selon sa catégorie. */
MH.itemIcon = function (it) {
  switch (it.cat) {
    case 'gg': return MH.iconFor('gg');
    case 'potion': return MH.iconFor('potion', it.tint);
    case 'parchemin': return MH.iconFor('scroll');
    case 'arme': return MH.iconFor('sword');
    case 'armure': return MH.iconFor('armor');
    case 'talisman': case 'relique': return MH.iconFor('amulet', it.cat === 'relique' ? '#ffd24a' : undefined);
    case 'bottes': return MH.iconFor('boots');
    case 'casque': return MH.iconFor('helm');
    case 'composant': return MH.iconFor('comp');
    case 'champignon': return MH.iconFor('mushroom', it.tint);
    default: return MH.iconFor('bag');
  }
};

/** Mini-carte du niveau courant (zones explorées). */
MH.R.drawMini = function () {
  const R = MH.R, G = MH.G; if (!R.miniCtx || !G) return;
  const g = R.miniCtx, p = G.p, L = G.levels[p.n], S = 2;
  g.fillStyle = '#05040a'; g.fillRect(0, 0, R.mini.width, R.mini.height);
  const T = MH.T;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const i = y * L.w + x; if (p.n !== 0 && !L.seen[i]) continue;
    const t = L.t[i];
    g.fillStyle = t === T.ROCK ? '#15131d' : t === T.SHAFT ? '#d9a441' : t === T.GRASS ? '#2f5a2c' : t === T.TREE ? '#1c3a1c' : t === T.PATH ? '#7d6a4c' : t === T.WALL ? '#6b2f2f' : t === T.FLOORB ? '#6b4a2b' : t === T.DOOR ? '#d9a441' : t === T.WATER ? '#24466e' : '#4a4660';
    g.fillRect(x * S, y * S, S, S);
  }
  const vue = MH.vueOf(p);
  MH.visibleEnts().forEach(e => { g.fillStyle = e.kind === 'monster' ? '#ff4a4a' : '#6ad0ff'; g.fillRect(e.x * S - 1, e.y * S - 1, 4, 4); });
  g.strokeStyle = 'rgba(255,210,100,0.6)'; g.strokeRect((p.x - vue) * S, (p.y - vue) * S, (2 * vue + 1) * S, (2 * vue + 1) * S);
  g.fillStyle = '#ffe27a'; g.fillRect(p.x * S - 1, p.y * S - 1, 4, 4);
};

'use strict';
/* ==========================================================================
   Interface : écran titre, HUD, panneaux, journal, clavier/souris

MH.UI = {

const UI = MH.UI;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Construction du DOM ---------- */

/* ---------- Écran titre ---------- */
UI.showTitle = function () {

    const ctr = (MH.TALENTS && MH.TALENTS[R.comp]) ? MH.TALENTS[R.comp].name : R.comp;

  }).join('');

    <div class="tbox">

      <p class="fine">Règles : mountyhall.com (officielles) — bestiaire et objets : valeurs de jeu inventées. Clavier : flèches/pavé num./ZQSD (positions physiques), F attaquer, G ramasser, X descendre, R monter, T s'entraîner, Entrée fin de tour.</p>

UI.startGame = function (opts) {
  $('title').style.display = 'none';
  $('app').style.display = 'block';
  $('log').innerHTML = '';
  MH.onLog = UI.appendLog;
  MH.newGame(opts);
  UI.target = null; MH.R.target = null;
  UI.started = true;
  UI.refresh();
  UI.lastT = performance.now();
  if (!UI.looping) { UI.looping = true; requestAnimationFrame(UI.frame); }
};

UI.frame = function (now) {
  const dt = Math.min(0.05, (now - (UI.lastT || now)) / 1000); UI.lastT = now;
  if (MH.G && UI.started) { try { MH.R.draw(dt); } catch (e) { console.error(e); } }
  requestAnimationFrame(UI.frame);
};

/* ---------- Journal ---------- */
UI.appendLog = function (e) {
  const log = $('log'); if (!log) return;
  const d = document.createElement('div'); d.className = 'l ' + e.cls; d.textContent = e.txt;
  log.appendChild(d);
  while (log.children.length > 220) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
};
UI.toast = function (msg, cls) {
  const b = $('banner'); if (!b) return;
  b.textContent = msg; b.className = 'show ' + (cls || '');
  clearTimeout(UI._tt); UI._tt = setTimeout(() => { b.className = ''; }, 2200);
};

/* ---------- Actions (enveloppe) ---------- */
UI.run = function (fn) {
  if (!MH.G || UI.modalOpen) return;
  let r;
  try { r = fn(); } catch (e) { console.error(e); UI.toast('Erreur : ' + e.message, 'bad'); r = { ok: false }; }
  if (r && !r.ok && r.msg) UI.toast(r.msg, 'bad');
  UI.refresh();
  return r;
};

UI.hostilesHere = function () {
  const p = MH.G.p;
  return MH.othersHere(p).filter(o => MH.hostile(p, o) && MH.canSee(p, o));
};
UI.pickTarget = function () {
  const here = UI.hostilesHere();
  if (UI.target && !UI.target.dead && here.includes(UI.target)) return UI.target;
  return here[0] || null;
};
UI.doAttack = function (t) {
  const p = MH.G.p; t = t || UI.pickTarget();
  if (!t) return { ok: false, msg: 'Aucun adversaire sur ta zone.' };
  UI.target = t; MH.R.target = t;
  return MH.actAttack(p, t);
};
UI.doMove = function (dx, dy, dn) {
  const p = MH.G.p, r = MH.actMove(p, dx, dy, dn || 0);
  if (r.ok) { if (dx) p.face = Math.sign(dx); UI.target = UI.pickTarget(); MH.R.target = UI.target; }
  return r;
};
UI.doPickupAll = function () {
  const p = MH.G.p, its = MH.itemsAt(p.n, p.x, p.y).slice();
  if (!its.length) return { ok: false, msg: 'Rien à ramasser ici.' };
  return MH.actPickup(p, its[0]);
};
UI.doEnd = function () {
  const r = MH.endTurn(); UI.target = null; MH.R.target = null; return r || { ok: true };
};
/** Marche automatique vers une zone visible, tant que les PA et le calme le permettent. */
UI.autoWalk = function (tx, ty) {
  const p = MH.G.p; let steps = 0, last = null;
  while (steps++ < 8 && (p.x !== tx || p.y !== ty)) {
    const st = MH.stepToward(p, tx, ty); if (!st) return last || { ok: false, msg: 'Pas de chemin.' };
    const before = UI.hostilesHere().length + MH.visibleEnts().filter(o => MH.hostile(p, o)).length;
    last = UI.doMove(st.dx, st.dy, 0); if (!last.ok) return last;
    const after = MH.visibleEnts().filter(o => MH.hostile(p, o)).length + UI.hostilesHere().length;

UI.MOVE = {

UI.onKey = function (e) {
  if (!MH.G || !UI.started) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (UI.modalOpen) { if (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape') { e.preventDefault(); UI._closeModal && UI._closeModal(); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const mv = UI.MOVE[e.code];
  if (mv) { e.preventDefault(); UI.run(() => UI.doMove(mv[0], mv[1], 0)); return; }
  switch (e.code) {
    case 'KeyF': case 'Space': e.preventDefault(); UI.run(() => UI.doAttack()); break;
    case 'KeyG': UI.run(UI.doPickupAll); break;
    case 'KeyX': case 'PageDown': e.preventDefault(); UI.run(() => UI.doMove(0, 0, 1)); break;
    case 'KeyR': case 'PageUp': e.preventDefault(); UI.run(() => UI.doMove(0, 0, -1)); break;
    case 'KeyT': UI.run(() => MH.actTrain(MH.G.p)); break;
    case 'KeyH': UI.run(() => MH.waitMinutes(60)); break;
    case 'Enter': e.preventDefault(); UI.run(UI.doEnd); break;
    case 'Tab': {
      e.preventDefault();
      const here = UI.hostilesHere(); if (here.length) { UI.target = here[(here.indexOf(UI.target) + 1) % here.length]; MH.R.target = UI.target; UI.refresh(); }
      break;
    }
    default:
      if (UI.onKeyExtra && UI.onKeyExtra(e)) return;
  }
};

UI.bind = function () {
  document.addEventListener('keydown', UI.onKey);
  const cv = $('cv');
  cv.addEventListener('mousemove', e => {
    if (!MH.G) return;
    const r = cv.getBoundingClientRect(), sx = cv.width / r.width, sy = cv.height / r.height;
    const t = MH.R.screenToTile((e.clientX - r.left) * sx, (e.clientY - r.top) * sy);
    MH.R.hover = t;
    const p = MH.G.p;
    if (MH.cheb(p.x, p.y, t.x, t.y) === 1 && MH.inb(MH.G.levels[p.n], t.x, t.y)) {
      const c = MH.moveCost(p, 0); MH.R.hoverCost = MH.isWalk(MH.G.levels[p.n], t.x, t.y) ? String(c) : '';
    } else MH.R.hoverCost = '';
    const tip = $('tip'), ents = MH.visibleEnts().filter(o => o.x === t.x && o.y === t.y);
    if (ents.length) {
      tip.style.display = 'block'; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 8) + 'px';
      tip.innerHTML = ents.map(o => `<b>${esc(o.name)}</b> niv.${o.lvl} — ${MH.woundText(o)}`).join('<br>');
    } else tip.style.display = 'none';
  });
  cv.addEventListener('mouseleave', () => { MH.R.hover = null; $('tip').style.display = 'none'; });
  cv.addEventListener('click', e => {
    if (!MH.G || UI.modalOpen) return;
    const r = cv.getBoundingClientRect(), sx = cv.width / r.width, sy = cv.height / r.height;
    const t = MH.R.screenToTile((e.clientX - r.left) * sx, (e.clientY - r.top) * sy), p = MH.G.p, L = MH.G.levels[p.n];
    if (!MH.inb(L, t.x, t.y)) return;
    if (t.x === p.x && t.y === p.y) { const h = UI.hostilesHere(); if (h.length) { UI.target = h[(h.indexOf(UI.target) + 1) % h.length]; MH.R.target = UI.target; UI.refresh(); } return; }
    const d = MH.cheb(p.x, p.y, t.x, t.y);
    if (d === 1) UI.run(() => UI.doMove(t.x - p.x, t.y - p.y, 0));
    else if (MH.isWalk(L, t.x, t.y) && (p.n === 0 || d <= MH.vueOf(p))) UI.run(() => UI.autoWalk(t.x, t.y));
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) {
      const row = e.target.closest('[data-sel]'); if (row && MH.G) { const o = UI.findEnt(+row.dataset.sel); if (o) { UI.target = o; MH.R.target = o; UI.refresh(); } }
      const fr = e.target.closest('[data-focus]'); if (fr && MH.G) { const [k, id] = fr.dataset.focus.split(':'); if (k !== 'i') { const o = UI.findEnt(+id); if (o) { UI.target = o; MH.R.target = o; UI.refresh(); } } }
      return;
    }
    if (b.dataset.race) { UI.pickedRace = b.dataset.race; UI.pickedName = ($('tname') || {}).value; UI.showTitle(); return; }
    if (b.id === 'go') {
      const name = ($('tname').value || 'Hébus').trim().slice(0, 18) || 'Hébus';
      UI.pickedName = name;
      if (MH.UI.beforeStart) MH.UI.beforeStart({ name, race: UI.pickedRace }); else UI.startGame({ name, race: UI.pickedRace, seed: Date.now() });
      return;
    }
    if (b.dataset.tab) { UI.tab = b.dataset.tab; UI.renderTabs(); UI.renderTab(); return; }
    const a = b.dataset.a; if (!a || !MH.G) return;
    const p = MH.G.p;
    switch (a) {
      case 'attack': UI.run(() => UI.doAttack()); break;
      case 'attack-id': UI.run(() => UI.doAttack(UI.findEnt(+b.dataset.id))); break;
      case 'pickup': UI.run(UI.doPickupAll); break;
      case 'identify-floor': UI.run(() => { const it = MH.itemsAt(p.n, p.x, p.y).find(i => i.id === +b.dataset.id); if (!it) return { ok: false }; p._identTarget = it; const r = MH.useTalent(p, 'identification_tresors', null); if (!r.success) p._identTarget = null; return r; }); break;
      case 'pickup-id': UI.run(() => { const it = MH.itemsAt(p.n, p.x, p.y).find(i => i.id === +b.dataset.id); return it ? MH.actPickup(p, it) : { ok: false }; }); break;
      case 'down': UI.run(() => UI.doMove(0, 0, 1)); break;
      case 'up': UI.run(() => UI.doMove(0, 0, -1)); break;
      case 'train': UI.run(() => MH.actTrain(p)); break;
      case 'improve': UI.run(() => MH.actImprove(p, b.dataset.k)); break;
      case 'wait': UI.run(() => MH.waitMinutes(60)); break;
      case 'end': UI.run(UI.doEnd); break;
      default: if (UI.onAction) UI.onAction(a, b);
    }
  });
};

'use strict';
/* ==========================================================================
   Interface des talents : répartition initiale, onglet, raccourcis
   ========================================================================== */
(function () {
  const UI = MH.UI, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Répartition des 50 points de connaissance ---------- */
  UI.beforeStart = function (opts) {
    const base = MH.baseTalents(opts.race), alloc = MH.defaultAlloc(opts.race);
    const total = () => base.reduce((s, id) => s + (alloc[id] || 0), 0);
    const draw = () => {
      const left = 50 - total();
      $('title').innerHTML = `<div class="tbox"><h1 style="font-size:40px;letter-spacing:3px">TALENTS DE DÉPART</h1>
        <h2>${esc(opts.name)} le ${MH.RACES[opts.race].name} — répartis tes <b>50 points de connaissance</b> (talent ≤ 50 % au départ)</h2>
        <div class="alloc">${base.map(id => {
          const T = MH.TALENTS[id], v = 15 + (alloc[id] || 0);
          return `<div class="arow"><div><b>${T.name}</b> <small>${T.type === 'comp' ? 'compétence' : 'sortilège'} · ${T.cost} PA</small><div class="dim">${esc(T.desc)}</div></div>
          <div class="ctl"><button data-al="${id}:-5">−5</button><button data-al="${id}:-1">−</button><span class="pct">${v} %</span><button data-al="${id}:1">+</button><button data-al="${id}:5">+5</button></div></div>`;
        }).join('')}</div>
        <p class="lead">Points restants : <b style="color:${left ? '#ffd24a' : '#8ae8c8'}">${left}</b></p>
        <div class="row"><button id="al-back">◀ Retour</button><button id="al-go" class="big">DESCENDRE AU GOUFFRE ▶</button></div></div>`;
    };
    UI.allocClick = function (e) {
      const b = e.target.closest('button'); if (!b) return false;
      if (b.dataset.al) {
        const [id, d] = b.dataset.al.split(':'), cur = alloc[id] || 0;
        alloc[id] = Math.max(0, Math.min(35, cur + (+d), cur + (+d) > cur ? cur + (50 - total()) : cur + (+d)));
        draw(); return true;
      }
      if (b.id === 'al-back') { UI.allocClick = null; UI.showTitle(); return true; }
      if (b.id === 'al-go') { UI.allocClick = null; UI.startGame({ name: opts.name, race: opts.race, seed: Date.now(), talents: alloc }); return true; }
      return false;
    };
    draw();
  };
  document.addEventListener('click', e => { if (UI.allocClick && UI.allocClick(e)) e.stopPropagation(); }, true);

  /* ---------- Cible des talents ---------- */
  UI.talentTarget = function (T) {
    const G = MH.G, p = G.p;
    if (T.target === 'zone') return UI.pickTarget();
    if (T.target !== 'view') return null;
    let t = UI.target;
    if (!t || t.dead || !MH.canSee(p, t) || !MH.hostile(p, t)) {
      const c = MH.visibleEnts().filter(o => MH.hostile(p, o) && MH.isTargetable(o)).sort((a, b) => MH.cheb(p.x, p.y, a.x, a.y) - MH.cheb(p.x, p.y, b.x, b.y));
      t = c[0] || null;
    }
    return t;
  };
  UI.doTalent = function (id) {
    const T = MH.TALENTS[id], p = MH.G.p;
    const tgt = UI.talentTarget(T);
    if (tgt && tgt !== UI.target) { UI.target = tgt; MH.R.target = tgt; }
    if (T.target === 'view' && T.id === 'connaissance_monstres' && !tgt) return { ok: false, msg: 'Aucune créature en vue.' };
    return MH.useTalent(p, id, tgt);
  };

  /* ---------- Onglet Talents ---------- */
  UI.tab_tal = function () {
    const p = MH.G.p;
    const list = MH.talentList(p);
    const conc = p.turn.conc || 0;
    let h = `<div class="tal"><div class="row"><span class="nmx">Concentration : <b>+${conc} %</b> sur le prochain talent <small class="dim">(−1 %/PA ; annulée par une attaque)</small></span></div>
      <div class="row" style="gap:4px">${[1, 2, 3].map(n => `<button data-a="conc" data-n="${n}" ${p.pa >= n ? '' : 'disabled'}>${n} PA</button>`).join('')}<span class="dim">→ +5 % par PA</span></div>
      <div class="row"><span class="nmx">RM <b>${p.rm}</b> · MM <b>${p.mm}</b></span></div>
      <table class="vt"><tr><th>Talent</th><th>%</th><th>PA</th><th></th></tr>`;
    list.forEach((T, i) => {
      const pct = p.talents[T.id], eff = Math.min(MH.TCAP[T.type] + 10, pct + conc);
      const tgt = UI.talentTarget(T);
      const need = (T.target === 'zone' || T.target === 'view') ? (p.n === 0 ? 'surface' : tgt ? null : 'cible') : null;
      const nothingId = T.id === 'identification_tresors' && !MH.identifyTargets(p).length;
      const can = p.pa >= T.cost && !need && !(T.noSurface && p.n === 0) && !nothingId;
      h += `<tr title="${esc(T.desc)}"><td><b>${T.name}</b>${T.reserved ? ' <small class="lv">réservé</small>' : ''}<br><small class="dim">${esc(T.desc)}</small></td>
        <td>${pct}${conc ? '→' + eff : ''} %<br><small class="dim">${T.type === 'comp' ? 'comp.' : 'sort'}</small></td><td>${T.cost}</td>
        <td><button data-a="tal" data-id="${T.id}" ${can ? '' : 'disabled'}>${i < 9 ? '[' + (i + 1) + '] ' : ''}Utiliser</button>${need ? '<br><small class="dim">' + (need === 'cible' ? 'pas de cible' : 'interdit ici') + '</small>' : nothingId ? '<br><small class="dim">rien à identifier</small>' : ''}</td></tr>`;
    });
    return h + '</table></div>';
  };

  /* ---------- Évolution : compétences apprenables ---------- */
  const oldEvo = UI.tab_evo;
  UI.tab_evo = function () {
    const p = MH.G.p; let h = oldEvo();
    const l = MH.learnableComps(p);
    if (l.length) {
      h += `<h4>Apprendre une compétence</h4><table class="vt"><tr><th>Compétence</th><th>Niv.</th><th>Coût</th><th></th></tr>`;
      l.forEach(T => {
        const ml = MH.compMinLevel(T), pi = 10 * T.tier, ok = p.lvl >= ml && p.pi >= pi && p.pa >= 5;
        h += `<tr title="${esc(T.desc)}"><td>${T.name}<br><small class="dim">${esc(T.desc)}</small></td><td>${ml}</td><td>${pi} PI</td><td><button data-a="learn" data-id="${T.id}" ${ok ? '' : 'disabled'}>5 PA</button></td></tr>`;
      });
      h += '</table>';
    }
    return h;
  };

  /* ---------- Barre d'actions : se relever ---------- */
  const oldRA = UI.renderActions;
  UI.renderActions = function () {
    oldRA();
    const p = MH.G.p;
    if (p.state.down) $('actions').insertAdjacentHTML('afterbegin', UI.btn('standup', 'Se relever', '', '2 PA', p.pa >= 2, 'pulse'));
  };

  UI.onAction = function (a, b) {
    const p = MH.G.p;
    switch (a) {
      case 'tal': UI.run(() => UI.doTalent(b.dataset.id)); break;
      case 'conc': UI.run(() => MH.actConcentrate(p, +b.dataset.n)); break;
      case 'learn': UI.run(() => MH.actLearnComp(p, b.dataset.id)); break;
      case 'standup': UI.run(() => MH.actStandUp(p)); break;
    }
  };
  UI.onKeyExtra = function (e) {
    const m = /^Digit([1-9])$/.exec(e.code);
    if (m) { const T = MH.talentList(MH.G.p)[+m[1] - 1]; if (T) { UI.run(() => UI.doTalent(T.id)); return true; } }
    if (e.code === 'KeyV') { UI.run(() => MH.actStandUp(MH.G.p)); return true; }
    return false;
  };

  /* ---------- Style ---------- */
  const st = document.createElement('style');
  st.textContent = `.alloc{max-width:760px;margin:12px auto;text-align:left}.arow{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#16121f;border:2px solid #3a3350;padding:8px 12px;margin:6px 0}
  .arow .ctl{display:flex;gap:4px;align-items:center;flex:0 0 auto}.arow .ctl button{background:#201a30;border:1px solid #4a4068;padding:4px 9px}.arow .ctl button:hover{border-color:#e0a43a}
  .arow .pct{display:inline-block;min-width:54px;text-align:center;color:#ffd24a;font-weight:bold}.tbox .row button:not(.big){background:#201a30;border:2px solid #4a4068;padding:8px 16px}`;
  document.head.appendChild(st);
})();

/* ===== 63_treasure_ui.js ===== */
'use strict';
/* ==========================================================================
   Interface des trésors : onglet Équipement, rafle, actions sur les objets
   ========================================================================== */
(function () {
  const UI = MH.UI, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  MH.treasureTab = true;

  const urlCache = {};
  MH.iconURL = function (it) {
    const key = it.cat + (it.tint || '');
    return urlCache[key] || (urlCache[key] = MH.itemIcon(it).toDataURL());
  };
  const SLOTS = [['arme', 'Arme'], ['armure', 'Armure'], ['casque', 'Casque'], ['bottes', 'Bottes'], ['talisman', 'Talisman']];

  /* ligne de comparaison : bonus/malus par rapport à ce qui est porté */
  UI.cmpHTML = function (it, p) {
    const c = MH.compareMods ? MH.compareMods(p, it) : null; if (!c) return '';
    const parts = c.parts.map(x => `<span class="${x.v > 0 ? 'cup' : 'cdn'}">${MH.signed(x.v)} ${MH.MOD_LABEL[x.k]}</span>`);
    if (c.dw) parts.push(`<span class="${c.dw < 0 ? 'cup' : 'cdn'}">${MH.signed(c.dw)} min</span>`);
    return parts.length ? `<small class="cmp">${c.empty ? 'emplacement libre : ' : 'vs porté : '}${parts.join(' ')}</small>` : '';
  };
  UI.itemRow = function (it, p) {
    const here = MH.othersHere(p).filter(o => MH.hostile(p, o) && MH.canSee(p, o));
    const tgt = here.includes(UI.target) ? UI.target : here[0];
    const b = (a, label, cost, ok, extra) => `<button data-a="${a}" data-id="${it.id}" ${ok ? '' : 'disabled'} ${extra || ''}>${label}${cost ? ' · ' + cost : ''}</button>`;
    let btn = '';
    if (MH.SLOT_OF[it.cat]) btn += b('equip', 'Équiper', MH.EQUIP_COST[it.cat] + ' PA', p.pa >= MH.EQUIP_COST[it.cat]);
    if (it.cat === 'potion') {
      btn += b('use', 'Boire', '2 PA', p.pa >= 2);
      if (tgt) btn += b('use-t', 'Lancer sur ' + esc(tgt.name), '2 PA', p.pa >= 2 && p.n !== 0);
    }
    if (it.cat === 'parchemin') {
      const known = it.ident || (it.sub === 'magique' && MH.G.knownScroll[it.mscroll]);
      btn += b('use', 'Lire', '2 PA', p.pa >= 2);
      if (it.sub === 'sort' && known) btn += b('learn-scroll', 'Apprendre', '5 PA', p.pa >= 5);
    }
    if (MH.isUnidentified(it)) {
      const T = MH.TALENTS.identification_tresors;
      btn += b('identify', 'Identifier', T.cost + ' PA', p.talents.identification_tresors !== undefined && p.pa >= T.cost);
    }
    btn += b('goinfre', 'Goinfrer', MH.goinfreCost(it) + ' PA', p.pa >= MH.goinfreCost(it));
    btn += b('drop', 'Jeter', '1 PA', p.pa >= 1);
    const mod = it.ident && Object.keys(it.mod).length ? '' : '';
    return `<div class="irow ${it.cursed && it.ident ? 'cursed' : ''}"><img src="${MH.iconURL(it)}" width="24" height="24" alt="">
      <div class="idesc"><b>${esc(MH.itemName(it))}</b><small>${it.w} min · ${it.price || 0} GG'</small>${UI.cmpHTML(it, p)}</div><div class="ibtn">${btn}</div></div>`;
  };

  UI.tab_sac = function () {
    const p = MH.G.p, dur = MH.duration(p);
    const wt = MH.weightOf(p);
    let h = `<div class="sac"><div class="row"><span class="nmx">Charge : <b>${wt} min</b> de DLA · tour de <b>${Math.floor(dur / 60)}h${String(Math.round(dur % 60)).padStart(2, '0')}</b></span><span>GG' <b>${p.gg}</b></span></div>
      <h4>Porté</h4>`;
    SLOTS.forEach(([k, lab]) => {
      const it = p.equip[k];
      h += `<div class="irow slot"><span class="slotlab">${lab}</span>${it ? `<img src="${MH.iconURL(it)}" width="24" height="24" alt=""><div class="idesc"><b>${esc(MH.itemName(it))}</b></div><div class="ibtn"><button data-a="unequip" data-slot="${k}" ${p.pa >= MH.EQUIP_COST[k] ? '' : 'disabled'}>Retirer · ${MH.EQUIP_COST[k]} PA</button></div>` : '<div class="idesc dim">—</div>'}</div>`;
    });
    h += `<h4>Sac (${p.inv.length})</h4>`;
    if (!p.inv.length) h += '<p class="dim">Ton sac est vide. Ramasse des trésors (1 PA) ou rafle-les.</p>';
    p.inv.slice().sort((a, b) => a.cat.localeCompare(b.cat)).forEach(it => { h += UI.itemRow(it, p); });
    h += '<p class="dim">Seule la catégorie est visible au sol. Les effets exacts demandent le sort <b>Identification des Trésors</b>. Les objets non portés risquent d\'être perdus à ta mort.</p></div>';
    return h;
  };

  /* Rafler dans l'onglet Zone */
  MH.zoneExtras = function () {
    const p = MH.G.p, items = MH.itemsAt(p.n, p.x, p.y);
    if (items.length < 2) return '';
    return `<div class="row" style="gap:4px;flex-wrap:wrap"><span class="nmx dim" style="flex:0 0 100%">Rafler (objets au hasard) :</span>${[2, 3, 4, 5, 6].map(n => `<button data-a="rafler" data-n="${n}" ${p.pa >= n ? '' : 'disabled'}>${n} PA · ${n - 1}D3+${n}</button>`).join('')}</div>`;
  };

  const prev = UI.onAction;
  UI.onAction = function (a, b) {
    const p = MH.G.p, id = +b.dataset.id, it = MH.findItem(p, id);
    switch (a) {
      case 'equip': return UI.run(() => it ? MH.actEquip(p, it) : { ok: false });
      case 'unequip': return UI.run(() => MH.actUnequip(p, b.dataset.slot));
      case 'drop': return UI.run(() => it ? MH.actDrop(p, it) : { ok: false });
      case 'use': return UI.run(() => it ? MH.actUseItem(p, it, null) : { ok: false });
      case 'use-t': return UI.run(() => { const t = UI.hostilesHere().includes(UI.target) ? UI.target : UI.hostilesHere()[0]; return it ? MH.actUseItem(p, it, t) : { ok: false }; });
      case 'learn-scroll': return UI.run(() => it ? MH.actLearnScroll(p, it) : { ok: false });
      case 'goinfre': return UI.run(() => it ? MH.actGoinfre(p, it) : { ok: false });
      case 'identify': return UI.run(() => { if (!it) return { ok: false }; p._identTarget = it; const r = MH.useTalent(p, 'identification_tresors', null); if (!r.success) p._identTarget = null; return r; });
      case 'rafler': return UI.run(() => MH.actRafler(p, +b.dataset.n));
    }
    return prev && prev(a, b);
  };

  const st = document.createElement('style');
  st.textContent = `.irow{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px dotted #221d33}
  .irow img{image-rendering:pixelated;flex:0 0 24px}.irow .idesc{flex:1;min-width:0;display:flex;flex-direction:column}.irow .idesc small{color:#7a7390}
  .irow .ibtn{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:210px}
  .irow button{background:#201a30;border:1px solid #4a4068;padding:1px 6px;font-size:11px}.irow button:hover:not(:disabled){border-color:#e0a43a}.irow button:disabled{opacity:.35;cursor:not-allowed}
  .irow.cursed .idesc b{color:#ff8070}.irow.slot{background:#181425}.slotlab{flex:0 0 62px;color:#e0a43a;font-size:11px;text-transform:uppercase}`;
  document.head.appendChild(st);
})();

/* ===== 64_places_ui.js ===== */
'use strict';
/* ==========================================================================
   Interface des lieux : onglet Lieu (échoppe, soin, forge, dojo, tanière, auberge)
   ========================================================================== */
(function () {
  const UI = MH.UI, $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const btn = (a, label, on, data) => `<button data-a="${a}" ${data || ''} ${on ? '' : 'disabled'}>${label}</button>`;

  /* ---------- onglet dynamique ---------- */
  const prevTabs = MH.societyTabs;
  MH.societyTabs = function (tabs) {
    if (prevTabs) prevTabs(tabs);
    if (MH.curPlace(MH.G.p)) tabs.unshift(['lieu', 'Lieu']);
  };

  const oldRefresh = UI.refresh;
  UI.refresh = function () {
    const G = MH.G; if (!G) return;
    const pl = MH.curPlace(G.p), id = pl ? pl.id : null;
    if (id !== UI._placeId) {
      if (id) UI.tab = 'lieu'; else if (UI.tab === 'lieu') UI.tab = 'zone';
      UI._placeId = id;
    }
    if (!id && UI.tab === 'lieu') UI.tab = 'zone';
    oldRefresh();
  };

  /* ---------- contenus ---------- */
  const itemLine = (it, actions) => `<div class="irow"><img src="${MH.iconURL(it)}" width="24" height="24" alt=""><div class="idesc"><b>${it.exception ? '★ ' : ''}${esc(MH.itemName(it))}</b><small>${it.w} min</small>${UI.cmpHTML ? UI.cmpHTML(it, MH.G.p) : ''}</div><div class="ibtn">${actions}</div></div>`;

  function echoppe(p) {
    const sh = MH.refreshShop();
    let h = `<h4>À vendre (renouvelé chaque jour)</h4>`;
    sh.stock.forEach(it => { const pr = MH.buyPrice(it); h += itemLine(it, btn('buy', `Acheter · ${pr} GG'`, p.gg >= pr, `data-id="${it.id}"`)); });
    if (!sh.stock.length) h += '<p class="dim">Rupture de stock.</p>';
    h += `<h4>Ton sac</h4>`;
    p.inv.forEach(it => {
      let a = btn('sell', `Vendre · ${MH.sellPrice(it)} GG'`, true, `data-id="${it.id}"`);
      if (!it.ident) a += btn('appraise', `Estimer · ${MH.identifyCost(it)} GG'`, p.gg >= MH.identifyCost(it), `data-id="${it.id}"`);
      h += itemLine(it, a);
    });
    if (!p.inv.length) h += '<p class="dim">Rien à vendre.</p>';
    return h + `<p class="dim">Les objets non identifiés se vendent 30 % de leur valeur, 50 % une fois identifiés.</p>`;
  }
  function soin(p) {
    const need = MH.hpMaxOf(p) - p.hp;
    return `<p>« Mama-Gluc recoud les Trõlls depuis trois cycles. » Tarif : <b>2 GG'</b> par PV.</p>
      <div class="row"><span class="nmx">PV : <b>${p.hp}/${MH.hpMaxOf(p)}</b></span>${btn('heal-full', `Soin complet · ${need * 2} GG'`, need > 0 && p.gg >= need * 2)}${btn('heal-part', `Tout mon or`, need > 0 && p.gg >= 2)}</div>` + (MH.brewHTML ? MH.brewHTML(p) : '');
  }
  function forge(p) {
    return `<p>Brokh forge, affûte et ajuste. Les bonus sont temporaires (5 tours).</p>` + Object.keys(MH.FORGE).map(k => {
      const F = MH.FORGE[k], has = !!p.equip[F.need];
      return `<div class="row"><span class="nmx"><b>${F.name}</b><br><small class="dim">${F.stat === 'deg' ? 'Dégâts' : 'Armure'} +${F.v} · ${has ? 'équipement prêt' : 'équipe d\'abord ' + (F.need === 'arme' ? 'une arme' : 'une armure')}</small></span>${btn('forge', `${F.cost} GG'`, has && p.gg >= F.cost, `data-k="${k}"`)}</div>`;
    }).join('');
  }
  function dojo(p) {
    let h = `<p>Maître Zrog : « On n'est jamais sûr de progresser. Parfois l'élève dépasse le maître. » (4 séances par jour, jusqu'à 70 %)</p><table class="vt"><tr><th>Talent</th><th>%</th><th></th></tr>`;
    MH.talentList(p).forEach(T => {
      const pct = p.talents[T.id], cost = MH.dojoCost(pct), cap = Math.min(MH.TCAP[T.type], 70);
      h += `<tr><td>${T.name}</td><td>${pct}</td><td>${btn('dojo', pct >= cap ? 'maîtrisé' : cost + ' GG\'', pct < cap && p.gg >= cost, `data-id="${T.id}"`)}</td></tr>`;
    });
    return h + '</table>';
  }
  function taniere(p) {
    const ch = MH.chest();
    let h = `<p>Le coffre de la tanière survit à ta mort. <b>${ch.items.length}/${MH.CHEST_MAX}</b> objets · <b>${ch.gg}</b> GG' en dépôt.</p>
      <div class="row" style="gap:4px;flex-wrap:wrap"><span class="nmx">GG' (tu as ${p.gg})</span>${btn('dep-gg', 'Déposer 50', p.gg > 0, 'data-n="50"')}${btn('dep-gg', 'Tout', p.gg > 0, 'data-n="999999"')}${btn('wd-gg', 'Retirer 50', ch.gg > 0, 'data-n="50"')}${btn('wd-gg', 'Tout', ch.gg > 0, 'data-n="999999"')}</div><h4>Dans le coffre</h4>`;
    ch.items.forEach(it => { h += itemLine(it, btn('wd', 'Reprendre', true, `data-id="${it.id}"`)); });
    if (!ch.items.length) h += '<p class="dim">Vide.</p>';
    h += '<h4>Ton sac</h4>';
    p.inv.forEach(it => { h += itemLine(it, btn('dep', 'Déposer', ch.items.length < MH.CHEST_MAX, `data-id="${it.id}"`)); });
    if (!p.inv.length) h += '<p class="dim">Sac vide.</p>';
    return h;
  }
  function auberge(p) {
    const b = MH.refreshBoard(p);
    let h = `<p class="note">« ${esc(MH.RUMORS[Math.floor(MH.G.time / 720) % MH.RUMORS.length])} »</p><h4>Tableau des missions</h4>`;
    const giverTag = m => m.giver && MH.GIVERS[m.giver] ? `<small class="dim">${esc(MH.GIVERS[m.giver].title)} · rép. ${MH.REP_TITLES[Math.min(4, MH.rep(m.giver))]}</small>` : '';
    if (p.mission) {
      const m = p.mission, st = MH.missionStatus(p), fin = st.ok;
      h += `<div class="row ${fin ? 'sel' : ''}"><span class="nmx"><b>${esc(m.title || 'Chasse : ' + m.name)}</b> ${m.kind && m.kind !== 'chasse' ? '' : st.done + '/' + st.count}<br><small class="dim">${esc(m.text || '')}${m.hint ? ' Indice : ' + esc(m.hint) + '.' : ''}</small><br><small class="dim">${m.gg} GG' + ${m.px} PX ${MH.rewardHint ? '· ' + MH.rewardHint(m) : ''}</small></span>${fin ? btn('m-claim', 'Réclamer', true) : ''}${btn('m-drop', 'Abandonner', true)}</div>`;

  UI.onAction = function (a, b) {
    const p = MH.G.p, run = UI.run;
    switch (a) {

'use strict';
/* ==========================================================================
   Sons : tout est synthétisé avec WebAudio (aucun fichier externe).
   ========================================================================== */
(function () {
  const A = MH.Audio = { ctx: null, on: true, drone: null };
  try { A.on = localStorage.getItem('mh_snd') !== '0'; } catch (e) {}
  A.init = function () {
    if (A.ctx || !A.on) return;
    try { const C = window.AudioContext || window.webkitAudioContext; if (!C) return; A.ctx = new C(); A.master = A.ctx.createGain(); A.master.gain.value = 0.5; A.master.connect(A.ctx.destination); } catch (e) { A.ctx = null; }
  };
  A.tone = function (f, d, type, vol, slide, delay) {
    if (!A.ctx || !A.on) return;
    const t = A.ctx.currentTime + (delay || 0), o = A.ctx.createOscillator(), g = A.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + d);
    g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0005, t + d);
    o.connect(g); g.connect(A.master); o.start(t); o.stop(t + d + 0.02);
  };
  A.noise = function (d, vol, freq, delay) {
    if (!A.ctx || !A.on) return;
    const t = A.ctx.currentTime + (delay || 0), n = Math.floor(A.ctx.sampleRate * d), b = A.ctx.createBuffer(1, n, A.ctx.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const s = A.ctx.createBufferSource(), f = A.ctx.createBiquadFilter(), g = A.ctx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq || 1200;
    g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0005, t + d);
    s.connect(f); f.connect(g); g.connect(A.master); s.start(t);
  };
  const SND = {
    step: () => A.noise(0.05, 0.05, 500),
    hit: () => { A.noise(0.12, 0.25, 1800); A.tone(160, 0.12, 'square', 0.12, 60); },
    crit: () => { A.noise(0.2, 0.3, 2500); A.tone(220, 0.25, 'sawtooth', 0.16, 50); A.tone(880, 0.1, 'triangle', 0.08, 440, 0.05); },
    hurt: () => { A.noise(0.15, 0.25, 900); A.tone(110, 0.2, 'sawtooth', 0.14, 50); },
    miss: () => A.noise(0.08, 0.1, 3000),
    loot: () => { A.tone(1200, 0.06, 'triangle', 0.1); A.tone(1800, 0.08, 'triangle', 0.08, 0, 0.05); },
    xp: () => A.tone(660, 0.12, 'triangle', 0.1, 990),
    lvl: () => [523, 659, 784, 1047].forEach((f, i) => A.tone(f, 0.25, 'triangle', 0.14, 0, i * 0.11)),
    death: () => { A.tone(200, 0.9, 'sawtooth', 0.2, 30); A.noise(0.6, 0.2, 400); },
    sys: () => {},
    ui: () => A.tone(500, 0.04, 'square', 0.05)
  };
  A.play = function (k) { if (A.on && A.ctx && SND[k]) { try { SND[k](); } catch (e) {} } };
  A.ambient = function (n) {
    if (!A.ctx || !A.on) return;
    if (!A.drone) {
      const o1 = A.ctx.createOscillator(), o2 = A.ctx.createOscillator(), g = A.ctx.createGain(), f = A.ctx.createBiquadFilter();
      o1.type = 'sawtooth'; o2.type = 'sawtooth'; o1.frequency.value = 55; o2.frequency.value = 55.7; f.type = 'lowpass'; f.frequency.value = 160; g.gain.value = 0;
      o1.connect(f); o2.connect(f); f.connect(g); g.connect(A.master); o1.start(); o2.start();
      A.drone = { g, o1, o2, f };
    }
    const d = A.drone, t = A.ctx.currentTime;
    d.g.gain.linearRampToValueAtTime(n === 0 ? 0.012 : 0.03 + 0.003 * Math.min(12, n), t + 1.5);
    d.o1.frequency.linearRampToValueAtTime(n === 0 ? 82 : 55 - Math.min(12, n) * 1.2, t + 1.5);
    d.o2.frequency.linearRampToValueAtTime((n === 0 ? 82 : 55 - Math.min(12, n) * 1.2) * 1.013, t + 1.5);
  };
  A.toggle = function () {
    A.on = !A.on; try { localStorage.setItem('mh_snd', A.on ? '1' : '0'); } catch (e) {}
    if (A.on) { A.init(); A.ambient(MH.G ? MH.G.p.n : 0); A.play('ui'); } else if (A.drone) A.drone.g.gain.value = 0;
    return A.on;
  };
  const UI = MH.UI;
  const oldLog = UI.appendLog;
  UI.appendLog = function (e) {
    oldLog(e);
    A.init(); A.play(e.cls === 'hit' ? (/CRITIQUE/.test(e.txt) ? 'crit' : 'hit') : e.cls === 'dodge' ? 'miss' : e.cls);
  };
  const oldMove = UI.doMove;
  UI.doMove = function () { const r = oldMove.apply(UI, arguments); if (r && r.ok) { A.init(); A.play('step'); } return r; };
  const oldRefresh = UI.refresh;
  UI.refresh = function () { oldRefresh(); if (MH.G && A.ctx) A.ambient(MH.G.p.n); };
  document.addEventListener('pointerdown', () => { A.init(); if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume(); }, { once: false });
})();

      case 'save-export': {
        const blob = new Blob([MH.serialize()], { type: 'application/json' }), u = URL.createObjectURL(blob), l = document.createElement('a');

  document.addEventListener('keydown', e => { if (e.code === 'KeyM' && MH.G && !UI.modalOpen && !/INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) { MH.Audio.toggle(); if (UI.tab === 'aide') UI.refresh(); } });
