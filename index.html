'use strict';
/* ==========================================================================
   Prévisualisation du combat et lecture des PA (cible sélectionnée)
   ========================================================================== */
(function () {
  const UI = MH.UI;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = v => Math.round(v * 100);

  /** Séquences de PA possibles vers la cible. */
  MH.paSequences = function (p, t) {
    const out = [], step = (p.n === 0 ? 1 : 2), occupied = MH.othersHere(p).length > 0;
    const d = MH.cheb(p.x, p.y, t.x, t.y), glue = p.state.glue > 0 ? 2 : 1;
    const walk = d === 0 ? 0 : Math.min(12, d * step * glue + (occupied ? 1 : 0));
    const row = (label, cost) => out.push({ label, cost, ok: cost <= p.pa, left: p.pa - cost });
    if (d === 0) { row('Attaque', 4); row('Attaque + ramassage', 5); row('Attaque ×2', 8); }
    else { row(`Marche (${d} zone${d > 1 ? 's' : ''})`, walk); row('Marche + attaque', walk + 4); }
    return out;
  };

  UI.previewHTML = function (p, t) {
    if (!t || t.dead || p.n === 0) return '';
    const o = MH.attackOdds(p, t), isMon = t.kind === 'monster';
    const know = !isMon || (p.talents && (p.talents.connaissance_monstres || 0) >= 25);
    const fz = v => know ? v : '≈ ' + (Math.round(v / 10) * 10);
    let h = `<h4>Cible : ${esc(t.name)} <small class="lv">niv.${t.lvl}</small></h4><div class="prev">`;
    h += `<div class="row"><span class="nmx">Toucher <b>${fz(pct(o.hit))} %</b> · Critique <b>${fz(pct(o.crit))} %</b></span></div>`;
    h += `<div class="pbar"><i style="width:${pct(o.hit)}%"></i><b style="width:${pct(o.crit)}%"></b></div>`;
    if (know) h += `<div class="row"><span class="nmx">Dégâts <b>${o.dmgMin}–${o.dmgMax}</b> (moy. ${o.dmgMean.toFixed(1)}${o.armor ? ', armure ' + o.armor : ''}) · ≈ <b>${isFinite(o.hitsToKill) ? o.hitsToKill : '∞'}</b> coup${o.hitsToKill > 1 ? 's' : ''} pour l'abattre</span></div>`;
    else h += `<div class="row"><span class="nmx dim">Dégâts et armure inconnus : monte « Connaissance des Monstres » (≥ 25 %).</span></div>`;
    if (p.state.glue > 0) h += `<div class="row"><span class="nmx dim">Englué : tes déplacements coûtent le double.</span></div>`;
    if (isMon && know && MH.tacticOf(t)) h += `<div class="row"><span class="nmx dim">${esc(MH.TACTIC_INFO[MH.tacticOf(t)])}</span></div>`;
    if (!isMon) h += `<div class="row"><span class="nmx dim">Humeur : ${t.mood ? MH.MOODS[t.mood] : '?'}${MH.hostile(p, t) ? ' · hostile' : ''}</span></div>`;
    h += `<table class="vt"><tr><th>Séquence</th><th>Coût</th><th>Reste</th></tr>`;
    MH.paSequences(p, t).forEach(s => { h += `<tr class="${s.ok ? '' : 'dim'}"><td>${s.label}</td><td>${s.cost} PA</td><td>${s.ok ? s.left + ' PA' : 'impossible'}</td></tr>`; });
    return h + '</table></div>';
  };

  const old = UI.tab_zone;
  UI.tab_zone = function () {
    const h = old(), p = MH.G.p, t = UI.target;
    const pv = t ? UI.previewHTML(p, t) : '';
    return pv ? h.replace('<h4>Au sol</h4>', pv + '<h4>Au sol</h4>') : h;
  };
})();

    if (s) {

      if (s.type === 'sanctuaire') {
        const near = MH.siteAt(p.n, p.x, p.y, 1) === s, day = Math.floor(MH.G.time / 1440);
        h += `<div class="row"><span class="nmx">Un autel moussu. Offrande : <b>${MH.prayCost(p)} GG'</b> → soins complets et bénédiction (1×/jour).<br><small class="dim">${near ? '' : 'Approche-toi de l\'autel (au centre). '}${s.prayed === day ? 'Déjà prié aujourd\'hui.' : ''}</small></span><button data-a="pray" ${near && s.prayed !== day && p.pa >= 1 && p.gg >= MH.prayCost(p) ? '' : 'disabled'}>Prier · 1 PA</button></div>`;
      } else if (s.type === 'crypte') h += `<p class="dim">${s.cleared ? 'La crypte est silencieuse.' : 'Une présence ancienne veille ici…'}</p>`;

  const prev = UI.onAction;
  UI.onAction = function (a, b) { if (a === 'pray') return UI.run(() => MH.actPray(MH.G.p)); return prev && prev(a, b); };

  /* bestiaire : la tactique est aussi révélée après 3 victoires */

  };

  UI.onAction = function (a, b) {
    const p = MH.G.p, run = UI.run;
    switch (a) {
      case 'troc-open': UI.trocWith = +b.dataset.id; UI.tab = 'troc'; return UI.refresh();
      case 'troc-buy': return run(() => MH.actTrocBuy(p, partner(), +b.dataset.id));
      case 'troc-sell': return run(() => MH.actTrocSell(p, partner(), +b.dataset.id));
    }
    return prev && prev(a, b);
  };
})();

/* ===== 74_alchemy_ui.js ===== */
'use strict';
/* Interface de la distillerie (onglet Lieu chez Mama-Gluc). */
(function () {
  const UI = MH.UI;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  UI.brewSel = [];
  MH.brewHTML = function (p) {
    const comps = p.inv.filter(i => i.cat === 'composant'); UI.brewSel = UI.brewSel.filter(id => comps.some(c => c.id === id));
    let h = `<h4>Distillerie</h4><p class="dim">Deux composants + ${MH.BREW_COST} GG' + 2 PA → une potion. La partie du monstre décide du type ; plus les composants sont bons, plus la réussite est sûre. Les mauvais composants donnent des mixtures : parfait pour lancer du poison… Garde les meilleurs pour l'enchanteur.</p>`;
    if (!comps.length) return h + '<p class="dim">Tu n\'as aucun composant.</p>';
    comps.slice().sort((a, b) => MH.compQual(a) - MH.compQual(b)).forEach(c => {
      const on = UI.brewSel.includes(c.id);
      h += `<div class="row ${on ? 'sel' : ''}"><span class="nmx">${esc(MH.itemName(Object.assign({}, c, { held: true })))}</span><button data-a="brew-sel" data-id="${c.id}">${on ? 'Retirer' : 'Choisir'}</button></div>`;
    });
    const a = comps.find(c => c.id === UI.brewSel[0]), b = comps.find(c => c.id === UI.brewSel[1]);
    if (a && b) h += `<div class="row"><span class="nmx">Réussite : <b>${Math.round(MH.brewChance(a, b) * 100)} %</b> · si ça réussit : potion ${MH.POTION[MH.brewType(a, b)].name}</span><button data-a="brew" ${p.pa >= 2 && p.gg >= MH.BREW_COST ? '' : 'disabled'}>Distiller · 2 PA</button></div>`;
    else h += '<p class="dim">Choisis deux composants.</p>';
    return h;
  };
  const prev = UI.onAction;
  UI.onAction = function (a, b) {
    const p = MH.G.p;
    if (a === 'brew-sel') { const id = +b.dataset.id, i = UI.brewSel.indexOf(id); if (i >= 0) UI.brewSel.splice(i, 1); else { UI.brewSel.push(id); if (UI.brewSel.length > 2) UI.brewSel.shift(); } return UI.refresh(); }
    if (a === 'brew') { const [x, y] = UI.brewSel; UI.brewSel = []; return UI.run(() => MH.actBrew(p, x, y)); }
    return prev && prev(a, b);
  };
})();
